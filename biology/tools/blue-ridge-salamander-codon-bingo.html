<script>
/* Blue Ridge Salamander Project genome engine. DRAFT v3 (two alleles, one spelling per allele), 2026-11-11.
   NOT FROZEN. Reid's answers of 11/11, 2:13 to 3:01 pm, are built in; the freeze waits on the tools and his go.
   A Creature Code regenerates the same genome every time. No server, no student data.
   Every gene draws from its own seeded stream (code + gene id), so adding a gene later
   never changes a gene students already decoded.

   What changed from v2 (decisions of 11/11, 1:04 to 1:40 pm):
   - One DNA spelling per allele for the whole ridge. Any two alleles of a gene differ at exactly one base.
   - Within one animal, the father's copy of a chromosome uses the mother's copy's filler DNA and gene
     positions, and differs only at the allele letters. Filler and positions stay unique to each animal.
   - The drawn set is the mother's: chromosomes 1 to 14 and the X she gave (15 strips). Males get a 16th
     strip, the Y from the father. A female's second X is a partner, not a strip.
   - Power gene (four codominant alleles) in place of Breath.
   - The stamp carries the edition and which genes are done. Keeper code = Creature Code + first three
     characters of the final stamp. */
const BRS = (function () {
  'use strict';
  const VERSION = 'v3 draft 2026-11-11';
  const EDITION = { id: '2026-27', mark: 'A', label: 'Edition 2026-27' };
  const EDITIONS = { A: EDITION };
  /* Both rules were settled with Reid on 11/11 (decisions log). They stay switches so the checks can run each way. */
  const DEFAULTS = {
    emberOnMotherCopy: true, // a new mutation sits on the mother's copy of chromosome 9; the father's copy is the ridge reference
    toxinGraded: true        // TT strong toxin, Tt mild, tt none (decided 2:17 pm)
  };
  const MUTATION_ODDS = 0.5; // a second die roll at the rock: 1 to 3 means the animal carries a new mutation (decided 2:13 pm)
  const ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // 31 characters, no 0 O 1 I L

  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rng(seed) {
    let a = hashStr(seed);
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- Three sites, three populations. Every fact here has a source in the session record. ---------- */
  const SITES = [
    { id: 'TF', die: [1, 2], pop: 'Talus Firetail', place: 'Hawksbill', region: 'Shenandoah National Park · Page and Madison counties', elev: '4,050 ft', lat: 38.555, lon: -78.395,
      rocks: ['greenstone slab', 'greenstone block', 'mossy greenstone'],
      text: 'The rock is greenstone, basalt lava changed by heat and pressure, and on the steep sides it breaks into slopes of loose blocks called talus. Balsam fir grows at the summit, one of the few places in the park where it does. The real Shenandoah salamander lives on this mountain and two others, and nowhere else on Earth.',
      legend: '' },
    { id: 'CE', die: [3, 4], pop: 'Cinder Eft', place: 'James River water gap', region: 'Blue Ridge Parkway at Otter Creek', elev: '649 ft', lat: 37.555, lon: -79.367,
      rocks: ['flat river stone', 'river cobble', 'mossy boulder'],
      text: 'The James River cuts straight through the Blue Ridge here, and the bank is the lowest point on the whole Blue Ridge Parkway. Stone locks from the old James River and Kanawha Canal still stand beside the water. In the mountains to the south, the real Peaks of Otter salamander lives in old hardwood forest in three Virginia counties and nowhere outside the state.',
      legend: '' },
    { id: 'HE', die: [5, 6], pop: 'Highland Emberback', place: 'Mount Rogers', region: 'Grayson and Smyth counties', elev: '5,729 ft', lat: 36.66, lon: -81.545,
      rocks: ['rhyolite slab', 'rhyolite block', 'mossy rhyolite'],
      text: 'Mount Rogers is the highest point in Virginia. Its rock is rhyolite, left by volcanoes that erupted here long ago, and a dark forest of spruce and Fraser fir covers the top. In the rivers of this corner of the state lives the real eastern hellbender, a salamander more than two feet long that local people call the snot-otter and the devil dog.',
      legend: '' }
  ];
  const site = id => SITES.find(s => s.id === id);
  const siteForRoll = n => SITES.find(s => s.die.indexOf(n) >= 0);

  /* ---------- Creature Codes: two site letters + four characters + one check character ---------- */
  function checkChar(six) {
    let sum = 0;
    for (let i = 0; i < six.length; i++) sum += ALPHA.indexOf(six[i]) * (i + 1);
    return ALPHA[sum % 31];
  }
  function parseCode(raw) {
    const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.length !== 7) return { ok: false, why: 'A Creature Code is two site letters and five characters, like TF-7K3QM.' };
    const pre = s.slice(0, 2), body = s.slice(2);
    if (!site(pre)) return { ok: false, why: 'A Creature Code starts with TF, CE or HE, the letters of the site where it was found.' };
    for (const ch of body) if (ALPHA.indexOf(ch) < 0) return { ok: false, why: 'Codes never use 0, 1, I, L or O. Look at the slip again.' };
    if (checkChar(pre + body.slice(0, 4)) !== body[4]) return { ok: false, why: 'That code has a typo in it. Check each character against the slip.' };
    return { ok: true, code: pre + '-' + body, site: pre };
  }
  function codeFrom(rand, siteId) {
    let four = '';
    for (let i = 0; i < 4; i++) four += ALPHA[Math.floor(rand() * 31)];
    return siteId + '-' + four + checkChar(siteId + four);
  }
  /* The second die roll. 1 to 3: the animal carries a new mutation. 4 to 6: it does not.
     The page draws codes until the animal behind one matches the roll, so the code alone still rebuilds the animal. */
  const mutationForRoll = n => n >= 1 && n <= 3;
  function codeForRolls(rand, siteRoll, mutationRoll) {
    const s = siteForRoll(siteRoll); if (!s || !(mutationRoll >= 1 && mutationRoll <= 6)) return null;
    for (;;) { const c = codeFrom(rand, s.id); if (hasMutation(c) === mutationForRoll(mutationRoll)) return c; }
  }
  function batch(word, n, siteId) {
    const r = rng('batch|' + String(word).trim().toLowerCase() + '|' + siteId);
    const out = [];
    while (out.length < n) { const c = codeFrom(r, siteId); if (out.indexOf(c) < 0) out.push(c); }
    return out;
  }

  /* ---------- The universal genetic code ---------- */
  const BASES = 'UCAG';
  const AA1 = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
  const THREE = { F: 'Phe', L: 'Leu', S: 'Ser', Y: 'Tyr', '*': 'STOP', C: 'Cys', W: 'Trp', P: 'Pro', H: 'His', Q: 'Gln', R: 'Arg', I: 'Ile', M: 'Met', T: 'Thr', N: 'Asn', K: 'Lys', V: 'Val', A: 'Ala', D: 'Asp', E: 'Glu', G: 'Gly' };
  const CODON = {}, SYN = {};
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) {
    const c = BASES[i] + BASES[j] + BASES[k], aa = THREE[AA1[i * 16 + j * 4 + k]];
    CODON[c] = aa; (SYN[aa] = SYN[aa] || []).push(c);
  }
  const AMINO = Object.keys(SYN).filter(a => a !== 'STOP').sort();
  const toRNA = { A: 'U', T: 'A', G: 'C', C: 'G' }, toDNA = { A: 'T', U: 'A', G: 'C', C: 'G' };
  const transcribe = dna => dna.split('').map(b => toRNA[b]).join('');
  const templateOf = rna => rna.split('').map(b => toDNA[b]).join('');
  function translate(codons) {
    const out = []; let stopped = false;
    for (const c of codons) {
      if (stopped) { out.push('none'); continue; }
      const aa = CODON[c]; out.push(aa); if (aa === 'STOP') stopped = true;
    }
    return out;
  }

  /* ---------- Trait list, genome format v3 ----------
     15 chromosome pairs: 1 to 14 plus the sex pair. A gene on the coding strand: TATAAA, a short spacer,
     ATG, seven more codons, a stop.
     ref = the gene's one spelling for the whole ridge, written as mRNA and carrying the first allele.
     at  = the codon (start codon = 0) where the alleles differ. Each allele swaps in its own codon there,
           and every pair of those codons is exactly one base apart.
     pf  = allele frequencies per site, as Reid approved them on 11/11 (decisions log). An animal's two alleles are drawn
           independently from pf, so every site is in Hardy-Weinberg proportions by construction. */
  const GENES = [
    { id: 'STR', chr: '1', name: 'Back stripe', kind: 'complete dominance', real: 'modeled on the striped and lead-backed forms of the red-backed salamander',
      ref: 'AUG GCU UGU CCU CUG GGA GAU UCU UAG', at: 2,
      alleles: [{ s: 'S', label: 'striped', codon: 'UGU' }, { s: 's', label: 'lead-backed', codon: 'CGU' }], pf: { TF: [0.3, 0.7], CE: [0.6, 0.4], HE: [0.7, 0.3] } },
    { id: 'COL', chr: '2', name: 'Ember color', kind: 'incomplete dominance', real: 'real stripes run from red to yellow',
      ref: 'AUG CAC GUC UCU GGG AAA GCU CUU UAG', at: 3,
      alleles: [{ s: 'R', label: 'red', codon: 'UCU' }, { s: 'Y', label: 'yellow', codon: 'UUU' }], pf: { TF: [0.7, 0.3], CE: [0.3, 0.7], HE: [0.5, 0.5] } },
    { id: 'TOX', chr: '2', name: 'Skin toxin', kind: 'incomplete dominance', real: 'many salamanders secrete skin toxins',
      ref: 'AUG AAA GAC ACG AUA GGG GCA UUC UGA', at: 2,
      alleles: [{ s: 'T', label: 'toxin glands', codon: 'GAC' }, { s: 't', label: 'no toxin', codon: 'AAC' }], pf: { TF: [0.6, 0.4], CE: [0.4, 0.6], HE: [0.5, 0.5] } },
    { id: 'SPT', chr: '3', name: 'Flecks and spots', kind: 'codominance', real: 'brass flecks occur on real woodland salamanders of the Blue Ridge',

      const speed = cl(8 - 0.6 * cr.plus + (ph.claws ? 2 : 0) - (ph.gills ? 1 : 0) + j() * 1.5, 1, 10);
      const stealth = cl(5 + (ph.striped ? -1 : 2) + (ph.glow === 'none' ? 2 : -2) - 0.3 * cr.plus + (ph.calls[0] === 'clicks' ? 1 : -1) + j(), 1, 10);
      const reach = cl(cr.length * (0.9 + 0.35 * ph.powers.length) + j() * 3, 4, 40);
      const dive = cl(5 + 1.5 * cr.plus + j() * 2, 2, 20);
      return [
        { k: 'Lifespan', v: life + ' years', bar: life / 32 }, { k: 'Land speed', v: speed + ' of 10', bar: speed / 10 }, { k: 'Stealth', v: stealth + ' of 10', bar: stealth / 10 },
        { k: 'Strike range', v: reach + ' cm', bar: reach / 40 }, { k: 'Time underwater', v: ph.gills ? 'no limit' : dive + ' min', bar: ph.gills ? 1 : dive / 20 }
      ];
    }

    return { OPTIONS: OPT, STATMAP, creature, entry, alleles };
  }

  /* ---------- Stamps: edition, progress that can be picked up, and the keeper code ----------
     A stamp is: edition mark + two check characters + hyphen + what is done.
       A4Y-15M   final: all 15 genes and the ember gene are done
       A4Y-K7Q2  progress: the last four characters record exactly which genes are done
     The check characters are tied to the Creature Code, the edition and what is done, so a stamp from one
     animal does not pass for another. Keeper code = Creature Code + hyphen + first three characters of the final stamp. */
  const PARTS = GENES.map(g => g.id).concat(['EMB']);            // 16 things a student finishes
  const FULL = Math.pow(2, PARTS.length) - 1;
  function maskOf(ids) { let m = 0; ids.forEach(function (id) { const i = PARTS.indexOf(id); if (i >= 0) m |= (1 << i); }); return m >>> 0; }
  function idsOf(mask) { return PARTS.filter((id, i) => (mask >>> i) & 1); }
  function enc4(n) { let s = ''; for (let i = 0; i < 4; i++) { s = ALPHA[n % 31] + s; n = Math.floor(n / 31); } return s; }
  function dec4(s) { let n = 0; for (const ch of s) { const v = ALPHA.indexOf(ch); if (v < 0) return -1; n = n * 31 + v; } return n; }
  function stampHead(code, mask, ed) {
    const h = hashStr('field-stamp|' + ed.id + '|' + code + '|' + mask);
    return ed.mark + ALPHA[h % 31] + ALPHA[(h >>> 5) % 31];
  }
  function stamp(code, done) {
    const mask = typeof done === 'number' ? done >>> 0 : maskOf(done);
    return stampHead(code, mask, EDITION) + '-' + (mask === FULL ? '15M' : enc4(mask));
  }
  function readStamp(code, raw) {
    const c = parseCode(code); if (!c.ok) return { ok: false, why: c.why };
    const m = /^([A-Z0-9]{3})-?(15M|[A-Z0-9]{4})$/.exec(String(raw || '').toUpperCase().replace(/\s/g, ''));
    if (!m) return { ok: false, why: 'A stamp looks like A4Y-K7Q2, or A4Y-15M when everything is done.' };
    const ed = EDITIONS[m[1][0]]; if (!ed) return { ok: false, why: 'That stamp is from an edition this page does not know.' };
    const mask = m[2] === '15M' ? FULL : dec4(m[2]);
    if (mask < 0 || mask > FULL || (m[2] !== '15M' && mask === FULL) || stampHead(c.code, mask, ed) !== m[1]) return { ok: false, why: 'That stamp does not belong to this Creature Code. Check each character.' };
    const done = idsOf(mask);
    return { ok: true, edition: ed.id, mask: mask, final: mask === FULL, done: done, left: PARTS.filter(id => done.indexOf(id) < 0), text: m[1] + '-' + m[2] };
  }
  function keeper(code) { const c = parseCode(code); return c.ok ? c.code + '-' + stampHead(c.code, FULL, EDITION) : null; }
  function readKeeper(raw) {
    const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.length !== 10) return { ok: false, why: 'A keeper code is a Creature Code and three more characters, like CE-MKYUK-A4Y.' };
    const c = parseCode(s.slice(0, 7)); if (!c.ok) return { ok: false, why: c.why };
    const ed = EDITIONS[s[7]]; if (!ed) return { ok: false, why: 'That keeper code is from an edition this page does not know.' };
    if (stampHead(c.code, FULL, ed) !== s.slice(7)) return { ok: false, why: 'The last three characters do not match this Creature Code. Check the pocket card.' };
    return { ok: true, code: c.code, site: c.site, edition: ed.id, text: c.code + '-' + s.slice(7) };
  }

  const std = make();
  /* A short mark of the whole genome build. Two pages that print the same mark draw the same animal for every code. */
  function fingerprint() {
    const r = rng('fingerprint'); let h = 2166136261;
    for (let n = 0; n < 12; n++) {
      const a = std.creature(codeFrom(r, SITES[n % 3].id));
      const t = a.code + a.sex + a.chroms.map(c => c.seq + (c.partner ? c.partner.seq : '')).join('') + a.genes.map(e => e.genotype).join('') + stamp(a.code, FULL);
      for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    }
    let out = ''; for (let i = 0; i < 6; i++) { out += ALPHA[h % ALPHA.length]; h = Math.floor(h / ALPHA.length); }
    return out.slice(0, 3) + '-' + out.slice(3);
  }
  return {
    VERSION, EDITION, EDITIONS, DEFAULTS, MUTATION_ODDS, hasMutation, mutationForRoll, codeForRolls, OPTIONS: std.OPTIONS, ALPHA, SITES, STATMAP: std.STATMAP, LAYOUT, site, siteForRoll, GENES, EMB, EMB_POOL, PARTS, FULL,
    CODON, SYN, AMINO, BASES, parseCode, codeFrom, batch, creature: std.creature, entry: std.entry, alleles: std.alleles, make,
    transcribe, templateOf, translate, stamp, readStamp, keeper, readKeeper, maskOf, idsOf, rng, checkChar, fingerprint
  };
})();
if (typeof module !== 'undefined') module.exports = BRS;

</script>
<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = $('#app');
  const KEY = 'codon-bingo-v3';
  const fresh = () => ({ c: { game: '', round: 'classic', pattern: 1, n: 0, shown: false, on: false, ending: false }, s: { game: '', cardId: null, tab: 'classic', marks: {}, pattern: 1, upto: '', code: '', m: [], yn: [], done: false } });
  let S = fresh();
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && j.c && j.s) { S = fresh(); Object.assign(S.c, j.c, { ending: false }); Object.assign(S.s, j.s); } } catch (e) { /* storage is a convenience only */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } };
  let claim = null, fb = '';

  const FULL = { Ala: 'Alanine', Arg: 'Arginine', Asn: 'Asparagine', Asp: 'Aspartic acid', Cys: 'Cysteine', Gln: 'Glutamine', Glu: 'Glutamic acid', Gly: 'Glycine', His: 'Histidine', Ile: 'Isoleucine', Leu: 'Leucine', Lys: 'Lysine', Met: 'Methionine', Phe: 'Phenylalanine', Pro: 'Proline', Ser: 'Serine', Thr: 'Threonine', Trp: 'Tryptophan', Tyr: 'Tyrosine', Val: 'Valine', STOP: 'Stop' };
  const norm = g => String(g || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const pair = { A: 'U', U: 'A', G: 'C', C: 'G' };
  const anti = codon => codon.split('').map(b => pair[b]).join('');
  const ALLCODONS = Object.keys(BRS.CODON);
  function shuffled(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function callList(game, round) {
    if (round === 'ember') return BRS.EMB.protein.map((aa, i) => ({ aa: aa, codon: BRS.EMB.mrna[i] }));
    const r = BRS.rng('bingo|' + norm(game) + '|calls');
    return shuffled(BRS.AMINO.concat(['STOP']), r).map(aa => ({ aa: aa, codon: BRS.SYN[aa][Math.floor(r() * BRS.SYN[aa].length)] }));
  }
  const cardCodons = (game, id) => shuffled(ALLCODONS, BRS.rng('bingo|' + norm(game) + '|card|' + id)).slice(0, 25);
  const LINES = (function () { const L = []; for (let i = 0; i < 5; i++) { L.push([0, 1, 2, 3, 4].map(k => i * 5 + k)); L.push([0, 1, 2, 3, 4].map(k => k * 5 + i)); } L.push([0, 6, 12, 18, 24]); L.push([4, 8, 12, 16, 20]); return L; })();
  const view = () => { const h = (location.hash || '').slice(1); return ['caller', 'card', 'howto'].indexOf(h) >= 0 ? h : 'home'; };

  /* one color per base everywhere; U is a round tile, T a square one; the letter is always printed */
  const bt = x => '<i class="bt b' + (x === 'U' ? 'T u' : x) + '">' + x + '</i>';
  const tiles = s => s.split('').map(bt).join('');
  const svgBase = (cx, cy, x, dim) => '<g' + (dim ? ' opacity=".5"' : '') + '>' + (x === 'U' ? '<circle cx="' + cx + '" cy="' + cy + '" r="10.5" fill="var(--bT)"/>' : '<rect x="' + (cx - 10) + '" y="' + (cy - 10) + '" width="20" height="20" rx="3" fill="var(--b' + x + ')"/>') +
    '<text x="' + cx + '" y="' + (cy + 5.5) + '" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-weight="700" font-size="15" fill="var(--b' + (x === 'U' ? 'T' : x) + '-ink)">' + x + '</text></g>';
  /* ---------- the ribosome picture ---------- */
  function trna(x, aa, codon, cls) {
    const ac = anti(codon);
    let s = '<g' + (cls ? ' class="' + cls + '"' : '') + '><rect x="' + (x - 20) + '" y="112" width="40" height="78" rx="14" fill="var(--ember-soft)" stroke="var(--ember)" stroke-width="2"/>' +
      '<text x="' + x + '" y="150" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--ink)">tRNA</text>' +
      '<circle cx="' + x + '" cy="88" r="24" fill="var(--ember)" stroke="var(--ink)" stroke-width="1.5"/><text x="' + x + '" y="94" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="700" font-size="17" fill="var(--paper)">' + aa + '</text>';
    for (let i = 0; i < 3; i++) s += svgBase(x - 24 + i * 24, 201, ac[i]) + '<path d="M' + (x - 24 + i * 24) + ' 213 v9" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 2"/>';
    return s + '</g>';
  }
  const codonText = (x, codon, dim) => [0, 1, 2].map(i => svgBase(x - 24 + i * 24, 238, codon[i], dim)).join('');
  function ribosome(calls, n, shown) {
    const cur = calls[n - 1], prev = n > 1 ? calls[n - 2] : null, P = 270, A = 400;
    let s = '<svg class="ribo" viewBox="0 0 720 300" role="img" aria-label="A ribosome reading mRNA"><ellipse cx="335" cy="150" rx="200" ry="104" fill="var(--moss-soft)" stroke="var(--moss)" stroke-width="2"/><ellipse cx="335" cy="262" rx="180" ry="28" fill="var(--moss-soft)" stroke="var(--moss)" stroke-width="2"/>' +
      '<text x="335" y="64" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" letter-spacing="2" fill="var(--moss)">RIBOSOME</text>' +
      '<rect x="14" y="224" width="692" height="28" rx="4" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/><text x="22" y="218" font-family="IBM Plex Mono,monospace" font-size="12" fill="var(--muted)">mRNA 5′</text><text x="698" y="218" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="12" fill="var(--muted)">3′</text>';
    [70, 150, 530, 630].forEach(x => { s += '<text x="' + x + '" y="243" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="19" fill="var(--muted)">· · ·</text>'; });
    const chain = calls.slice(Math.max(0, n - 7), n - 1).filter(c => c.aa !== 'STOP');
    if (prev && prev.aa !== 'STOP') {
      s += codonText(P, prev.codon, true) + trna(P, prev.aa, prev.codon, '');
      chain.slice(0, -1).reverse().forEach(function (c, k) { const x = P - 46 * (k + 1), y = 88 - 6 * (k + 1); s += '<circle cx="' + x + '" cy="' + y + '" r="21" fill="var(--panel)" stroke="var(--ember)" stroke-width="2"/><text x="' + x + '" y="' + (y + 5) + '" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="700" font-size="14" fill="var(--ink)">' + c.aa + '</text>'; });
    }
    if (cur && shown) {
      s += codonText(A, cur.codon, false);
      if (cur.aa === 'STOP') s += '<g class="arrive"><rect x="' + (A - 34) + '" y="96" width="68" height="112" rx="22" fill="var(--bad-soft)" stroke="var(--bad)" stroke-width="2"/><text x="' + A + '" y="146" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--ink)">release</text><text x="' + A + '" y="162" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--ink)">factor</text></g>';
      else s += trna(A, cur.aa, cur.codon, 'arrive');
    } else if (cur) s += '<text x="' + A + '" y="243" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="19" fill="var(--ink)">? ? ?</text>';
    return s + '</svg>';
  }

  /* ---------- home and how to play ---------- */
  function homeView() {
    return '<section class="block"><span class="eyebrow">Unit 4 · LT 4.3 and 4.5</span><h2>One caller, a different card on every iPad</h2><p class="lede">The teacher calls an amino acid. Each student finds the codons on their own card that code for it, using a codon chart or wheel. After every call the projector shows the tRNA that carries that amino acid into the ribosome.</p>' +
      '<div class="row"><a class="btn" href="#caller">Run the game on the projector</a><a class="btn ghost" href="#card">Open my card</a><a class="btn quiet" href="#howto">How to play</a></div></section>';
  }
  function howView() {
    return '<section class="block"><span class="eyebrow">For the teacher</span><h2>How to run Codon Bingo</h2><p class="lede">Two rounds, about fifteen minutes each. Students need a codon chart or wheel.</p>' +
      '<h3>Set up, two minutes</h3><ol><li>On the projector, choose <b>Run the game</b>, type a game word, and press Start.</li><li>Students choose <b>Open my card</b> and type the same game word. Every iPad draws a different card of 25 mRNA codons.</li></ol>' +
      '<h3>Round 1 · Classic</h3><ol><li>Press <b>Next call</b> and read the amino acid aloud.</li><li>Students find <b>every</b> codon on their card that codes for it and tap each one. Give them about half a minute.</li><li>Press <b>Show the tRNA</b>. Say what the picture shows: the tRNA carries the amino acid, and its anticodon pairs with the codon on the mRNA.</li><li>Call again. A student with a full line of five taps <b>Check my bingo</b> and enters the call number from the projector. A green screen is a true bingo. A red message outlines any marked square that does not code for something called, and one wrong mark anywhere on the card blocks the bingo.</li></ol>' +
      '<p><b>Setting the length.</b> In a class of 30, the first true line usually comes around call 7 and the first two-line card around call 10. A full card is rare before call 19, and every card is full by call 21.</p>' +
      '<h3>Round 2 · The Ember Round</h3><ol><li>Start a new game and choose <b>Ember Round</b>. Students switch their card to <b>Ember Round</b> and type their Creature Code.</li><li>Each iPad shows that salamander’s own copy of the ember gene as template DNA. Students transcribe it into mRNA first.</li><li>Call the normal ember protein in order: eight amino acids, then the stop. For each call, students check their own codon and tap <b>codes for it</b> or <b>does not</b>.</li><li>Students press Check. Anyone with a mismatch has found their salamander’s changed amino acid. Anyone whose chain stops early has found a stop codon. Anyone whose calls all match checks the lab slip: either one base changed without changing the protein, a silent change, or the animal has no new mutation.</li></ol>' +
      '<p class="muted">A DE Bio round, with a TATA box, the AUG start and a poly-A tail on the projector, is not built yet.</p><div class="row"><a class="btn ghost" href="#home">Back</a></div></section>';
  }

  /* ---------- caller ---------- */
  function callerView() {
    const c = S.c;
    if (!c.on) {
      return '<section class="block"><span class="eyebrow">Projector</span><h2>Start a game</h2><form data-form="start" class="stack"><div class="field"><label for="gw">Game word</label><input type="text" id="gw" maxlength="12" autocapitalize="characters" autocomplete="off" spellcheck="false" value="' + esc(c.game || 'RIDGE' + (10 + Math.floor(Math.random() * 89))) + '" style="max-width:14rem"><span class="small muted">Students type this word to get their cards.</span></div>' +
        '<fieldset><legend>Round</legend><label class="opt"><input type="radio" name="round" id="r-classic" value="classic"' + (c.round !== 'ember' ? ' checked' : '') + '><span><b>Classic.</b> All 20 amino acids and Stop, in a shuffled order.</span></label><label class="opt"><input type="radio" name="round" id="r-ember" value="ember"' + (c.round === 'ember' ? ' checked' : '') + '><span><b>Ember Round.</b> The nine calls of the normal ember protein: eight amino acids and the stop, checked against each student’s own salamander.</span></label></fieldset>' +
        '<div class="field"><label for="pat">A classic win is</label><select id="pat" style="max-width:14rem">' + [[1, 'one line of five'], [2, 'two lines'], [12, 'the whole card']].map(p => '<option value="' + p[0] + '"' + (c.pattern === p[0] ? ' selected' : '') + '>' + p[1] + '</option>').join('') + '</select></div><div class="row"><button>Start</button><a class="btn quiet" href="#howto">How to play</a></div></form></section>';
    }
    const calls = callList(c.game, c.round), cur = c.n ? calls[c.n - 1] : null, total = calls.length;
    let cap = '';
    if (cur && c.shown) cap = cur.aa === 'STOP' ? 'No tRNA has an anticodon for ' + cur.codon + '. A release factor fits there instead, and the finished chain is set free.' : 'The tRNA with anticodon ' + anti(cur.codon) + ' carries ' + cur.aa + ' to the codon ' + cur.codon + '. ' + (BRS.SYN[cur.aa].length > 1 ? BRS.SYN[cur.aa].length + ' different codons code for ' + cur.aa + '.' : 'Only this one codon codes for ' + cur.aa + '.');
    else if (cur) cap = 'Find it on the chart, mark your card, then watch the tRNA arrive.';
    let h = '<section class="block callbox"><div class="gamebar"><span>Game word <b class="gw">' + esc(norm(c.game)) + '</b></span><span>' + (c.round === 'ember' ? 'Ember Round' : 'Classic · win with ' + (c.pattern === 1 ? 'one line' : c.pattern === 2 ? 'two lines' : 'the whole card')) + '</span></div>';

    h += ribosome(calls, c.n, c.shown) + '<p class="caption" aria-live="polite">' + cap + '</p>';
    h += '<div class="row">' + (cur && !c.shown ? '<button data-act="show">Show the tRNA</button>' : '') + (c.n < total ? '<button class="' + (cur && !c.shown ? 'ghost' : '') + '" data-act="next">Next call</button>' : '<b>That was the last call.</b>') + (c.n > 0 ? '<button class="quiet" data-act="back">Back one</button>' : '') + '</div>';
    if (c.n) h += '<div class="called" aria-label="Called so far">' + calls.slice(0, c.n).map((x, i) => '<span' + (i === c.n - 1 ? ' class="now"' : '') + '><i>' + (i + 1) + '</i>' + x.aa + '</span>').join('') + '</div>';
    if (c.round === 'ember' && c.n === total && c.shown) h += '<p class="say good">Check your answers now. A mismatch is your salamander’s changed amino acid. If every call matched, look at your lab slip: either the change is silent and still there in the DNA, or your animal has no new mutation.</p>';
    h += '</section><section class="block">' + (c.ending ? '<p>End this game and set up a new one?</p><div class="row"><button data-act="end">Yes, end it</button><button class="ghost" data-act="keepgame">Keep playing</button></div>' : '<div class="row"><button class="quiet" data-act="askend">End this game</button><a class="btn quiet" href="#howto">How to play</a></div>') + '</section>';
    return h;
  }

  /* ---------- student card ---------- */
  function chart() {
    const B = BRS.BASES;
    let h = '<div class="scroll"><table class="chart"><thead><tr><th scope="col">1st</th>' + B.split('').map(b => '<th scope="col">2nd ' + bt(b) + '</th>').join('') + '</tr></thead><tbody>';
    for (const a of B) { h += '<tr><th scope="row">' + bt(a) + '</th>'; for (const b of B) h += '<td>' + B.split('').map(c => { const cd = a + b + c, aa = BRS.CODON[cd]; return '<span class="' + (aa === 'STOP' ? 'stop' : cd === 'AUG' ? 'start' : '') + '">' + cd + ' ' + aa + '</span>'; }).join('<br>') + '</td>'; h += '</tr>'; }
    return h + '</tbody></table></div>';
  }
  function cardView() {
    const s = S.s;
    if (!s.game) return '<section class="block"><span class="eyebrow">My card</span><h2>Type the game word from the projector</h2><form data-form="join" class="row"><div class="field"><label for="jw">Game word</label><input type="text" id="jw" maxlength="12" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="RIDGE42"></div><button style="align-self:flex-end">Get my card</button></form>' + (fb ? '<p class="say warn">' + fb + '</p>' : '') + '</section>';
    let h = '<section class="block"><div class="gamebar"><span>Game <b class="gw">' + esc(norm(s.game)) + '</b></span><span>Card ' + s.cardId + '</span></div><div class="tabs" role="group" aria-label="Round"><button data-act="tab" data-t="classic" aria-pressed="' + (s.tab === 'classic') + '">Classic card</button><button data-act="tab" data-t="ember" aria-pressed="' + (s.tab === 'ember') + '">Ember Round</button></div>';
    if (s.tab === 'classic') {
      const codons = cardCodons(s.game, s.cardId);
      const bad = claim && claim.bad ? claim.bad : {};
      h += '<p>When an amino acid is called, tap <b>every</b> codon on this card that codes for it.</p><div class="card" role="group" aria-label="Bingo card">' + codons.map((cd, i) => '<button class="sq' + (bad[i] ? ' wrong' : '') + '" data-act="mark" data-i="' + i + '" aria-pressed="' + !!s.marks[i] + '" aria-label="' + cd + '">' + tiles(cd) + '</button>').join('') + '</div>';
      if (claim && claim.ok) h += '<div class="win" role="status"><b>BINGO</b><span>Card ' + s.cardId + ' · game ' + esc(norm(s.game)) + ' · true at call ' + claim.n + '</span></div>';
      else if (claim) h += '<p class="say warn" role="status">' + claim.msg + '</p>';
      h += '<div class="row"><div class="field"><label for="upto">Call number on the projector</label><select id="upto" style="max-width:9rem"><option value="">Choose</option>' + Array.from({ length: 21 }, (x, i) => '<option' + (String(s.upto) === String(i + 1) ? ' selected' : '') + '>' + (i + 1) + '</option>').join('') + '</select></div><div class="field"><label for="spat">A win is</label><select id="spat" style="max-width:11rem">' + [[1, 'one line'], [2, 'two lines'], [12, 'the whole card']].map(p => '<option value="' + p[0] + '"' + (s.pattern === p[0] ? ' selected' : '') + '>' + p[1] + '</option>').join('') + '</select></div><button data-act="claim" style="align-self:flex-end">Check my bingo</button></div><div class="row"><button class="quiet" data-act="clear">Clear my marks</button><button class="quiet" data-act="leave">Join a different game</button></div>';
    } else {
      const cr = s.code ? BRS.creature(s.code) : null;
      if (!cr) h += '<p>The Ember Round is played on your own salamander.</p><form data-form="code" class="row"><div class="field"><label for="cc">Creature Code</label><input type="text" id="cc" maxlength="10" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="TF-7K3QM"></div><button style="align-self:flex-end">Load my salamander</button></form>' + (fb ? '<p class="say warn">' + fb + '</p>' : '');
      else {
        const m = cr.mut || Object.assign({ kind: 'none' }, cr.ember.copies[0]), N = m.template.length;
        h += '<p><b>' + cr.code + '</b> · its copy of the ember gene, from its mother. First transcribe the template DNA into mRNA. Then, for each amino acid called, check your own codon on the chart.</p><div class="strand"><span class="lab">Template DNA 3′ → 5′</span><div class="six">' + m.template.map(t => '<div class="cod">' + tiles(t) + '</div>').join('') + '</div><span class="lab">mRNA 5′ → 3′</span><div class="six">' + m.template.map((t, i) => s.done ? '<div class="cod">' + tiles(m.mrna[i]) + '</div>' : '<input type="text" class="mrna" id="em-' + i + '" data-i="' + i + '" maxlength="3" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="mRNA codon ' + (i + 1) + '" value="' + esc((s.m[i] || '').replace(/[^A-Z]/g, '')) + '">').join('') + '</div><span class="lab">Called: ' + BRS.EMB.protein.join(' · ') + '</span><div class="six">' + m.template.map((t, i) => s.done ? '<span>' + (BRS.CODON[m.mrna[i]] === BRS.EMB.protein[i] ? '✓' : '✗') + '</span>' : '<select class="yn" id="yn-' + i + '" data-i="' + i + '" aria-label="Call ' + (i + 1) + ', ' + BRS.EMB.protein[i] + '"><option value="">?</option><option value="y"' + (s.yn[i] === 'y' ? ' selected' : '') + '>codes for it</option><option value="n"' + (s.yn[i] === 'n' ? ' selected' : '') + '>does not</option></select>').join('') + '</div></div>';
        if (s.done) {
          const what = m.kind === 'none' ? 'Every call matched, and the DNA matches the ridge reference at every base. This salamander has no new mutation, as its lab slip said.' : m.kind === 'silent' ? 'Every call matched, so this salamander builds the normal ember protein. Its DNA still differs from the ridge reference by one base, in codon ' + (m.codon + 1) + ': ' + m.oldCodon + ' became ' + m.newCodon + ', and both code for ' + m.oldAA + '. That is a silent change.'
            : m.kind === 'missense' ? 'Call ' + (m.codon + 1) + ' did not match. Where the ridge reference builds ' + m.oldAA + ', this salamander builds ' + m.newAA + '. One amino acid in the chain is different.'
              : 'Call ' + (m.codon + 1) + ' did not match. This salamander’s codon ' + (m.codon + 1) + ' is a stop codon, so the ribosome lets go there and the chain is only ' + m.codon + ' amino acids long.';
          h += '<div class="result"><b>' + (m.kind === 'none' ? 'Checked.' : 'Found it.') + '</b><span>' + what + '</span><span>Take this to step 3 of the Blue Ridge Salamander Project.</span></div>';
        } else h += '<div class="row"><button data-act="echeck">Check my answers</button></div>' + (fb ? '<p class="say warn" role="status">' + fb + '</p>' : '');
        h += '<div class="row"><button class="quiet" data-act="ecode">Use a different Creature Code</button></div>';
      }
    }
    return h + '</section><details' + (S.s.tab === 'ember' ? ' open' : '') + '><summary>Codon chart</summary><p class="small muted">First base on the left, second base across the top, third base inside the box.</p>' + chart() + '</details>';
  }
  function checkClaim() {
    const s = S.s, n = +s.upto;
    if (!n) return { msg: 'Choose the call number shown on the projector first.' };
    const codons = cardCodons(s.game, s.cardId), called = {};
    callList(s.game, 'classic').slice(0, n).forEach(c => { called[c.aa] = 1; });
    const valid = i => !!called[BRS.CODON[codons[i]]];
    const full = LINES.filter(L => L.every(i => s.marks[i])).length;
    const marked = Array.from({ length: 25 }, (x, i) => i).filter(i => s.marks[i]);
    const bad = {}; let nbad = 0;
    marked.forEach(i => { if (!valid(i)) { bad[i] = 1; nbad++; } });
    if (nbad) return { bad: bad, msg: nbad + ' marked ' + (nbad === 1 ? 'square does' : 'squares do') + ' not code for anything called by call ' + n + '. They are outlined with dashes. Check them on the chart, unmark them, and try again.' };
    if (s.pattern === 12 ? marked.length === 25 : full >= s.pattern) return { ok: true, n: n };
    return { msg: s.pattern === 12 ? 'The whole card is not marked yet.' : s.pattern === 2 ? 'Two full lines are needed. This card has ' + full + '.' : 'No full line of five yet.' };
  }

  /* ---------- render and events ---------- */
  function render() { const v = view(); app.innerHTML = v === 'caller' ? callerView() : v === 'card' ? cardView() : v === 'howto' ? howView() : homeView(); }
  app.addEventListener('click', function (ev) {
    const t = ev.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act, c = S.c, s = S.s;
    if (a === 'next') { c.n++; c.shown = false; }
    else if (a === 'show') c.shown = true;
    else if (a === 'back') { c.n = Math.max(0, c.n - 1); c.shown = c.n > 0; }
    else if (a === 'askend') c.ending = true;
    else if (a === 'keepgame') c.ending = false;
    else if (a === 'end') { const g = c.game; S.c = fresh().c; S.c.game = ''; void g; }
    else if (a === 'tab') { s.tab = t.dataset.t; fb = ''; claim = null; }
    else if (a === 'mark') { const i = t.dataset.i; s.marks[i] = !s.marks[i]; claim = null; save(); t.setAttribute('aria-pressed', String(!!s.marks[i])); t.classList.remove('wrong'); const w = $('.win'); if (w) render(); return; }
    else if (a === 'claim') claim = checkClaim();
    else if (a === 'clear') { s.marks = {}; claim = null; }
    else if (a === 'leave') { const keep = { code: s.code }; S.s = Object.assign(fresh().s, keep); claim = null; fb = ''; }
    else if (a === 'ecode') { s.code = ''; s.m = []; s.yn = []; s.done = false; fb = ''; }
    else if (a === 'echeck') {
      const cr = BRS.creature(s.code), m = cr.mut || Object.assign({ kind: 'none' }, cr.ember.copies[0]); let ok = true, sawT = false;
      m.template.forEach(function (x, i) {
        const mi = $('#em-' + i), yi = $('#yn-' + i), mv = mi.value.trim().toUpperCase(), okm = mv === m.mrna[i], oky = yi.value === (BRS.CODON[m.mrna[i]] === BRS.EMB.protein[i] ? 'y' : 'n');
        if (mv.indexOf('T') >= 0) sawT = true;
        mi.classList.toggle('ok', okm); mi.classList.toggle('bad', !okm); yi.classList.toggle('ok', oky); yi.classList.toggle('bad', !oky); ok = ok && okm && oky;
      });
      if (ok) { s.done = true; fb = ''; } else { const el = $('.say.warn'); const msg = (sawT ? 'RNA has no T. Where DNA would use T, RNA uses U. ' : '') + 'Boxes with a dashed border need another look. Fix the mRNA first, because a wrong base changes what the codon codes for.'; fb = msg; save(); if (el) el.textContent = msg; else t.parentNode.insertAdjacentHTML('afterend', '<p class="say warn" role="status">' + msg + '</p>'); return; }
    }
    save(); render();
  });
  app.addEventListener('input', function (ev) {
    const t = ev.target;
    if (t.classList.contains('mrna')) { t.value = t.value.toUpperCase().replace(/[^A-Z]/g, ''); S.s.m[+t.dataset.i] = t.value; save(); t.classList.remove('ok', 'bad'); if (t.value.length === 3) { const nx = $('#em-' + (+t.dataset.i + 1)); if (nx && !nx.value) nx.focus(); } }
  });
  app.addEventListener('change', function (ev) {
    const t = ev.target;
    if (t.classList.contains('yn')) { S.s.yn[+t.dataset.i] = t.value; t.classList.remove('ok', 'bad'); save(); }
    else if (t.id === 'upto') { S.s.upto = t.value; save(); }
    else if (t.id === 'spat') { S.s.pattern = +t.value; claim = null; save(); }
  });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const f = ev.target.dataset.form;
    if (f === 'start') { const g = norm($('#gw').value); if (g.length < 3) { $('#gw').focus(); return; } S.c = Object.assign(fresh().c, { game: g, round: $('#r-ember').checked ? 'ember' : 'classic', pattern: +$('#pat').value, on: true }); }
    else if (f === 'join') { const g = norm($('#jw').value); if (g.length < 3) { fb = 'Type the game word exactly as the projector shows it.'; render(); return; } fb = ''; S.s = Object.assign(fresh().s, { game: g, cardId: 1000 + Math.floor(Math.random() * 9000), code: S.s.code }); }
    else if (f === 'code') { const p = BRS.parseCode($('#cc').value); if (!p.ok) { fb = p.why; render(); return; } fb = ''; S.s.code = p.code; S.s.m = []; S.s.yn = []; S.s.done = false; }
    save(); render();
  });
  window.addEventListener('hashchange', function () { fb = ''; claim = null; render(); window.scrollTo(0, 0); });
  render();
  (function () { const gm = document.getElementById('gm'); if (gm) gm.textContent = BRS.fingerprint(); })();
})();

</script>

</body></html>
