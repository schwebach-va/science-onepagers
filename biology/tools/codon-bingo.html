<script>
/* The universal genetic code, shared by every round. Codon Bingo needs nothing else from the salamander engine. */
const BRS = (function () {
  'use strict';
  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rng(seed) {
    let a = hashStr(seed);
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const BASES = 'UCAG';
  const AA1 = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
  const THREE = { F: 'Phe', L: 'Leu', S: 'Ser', Y: 'Tyr', '*': 'STOP', C: 'Cys', W: 'Trp', P: 'Pro', H: 'His', Q: 'Gln', R: 'Arg', I: 'Ile', M: 'Met', T: 'Thr', N: 'Asn', K: 'Lys', V: 'Val', A: 'Ala', D: 'Asp', E: 'Glu', G: 'Gly' };
  const CODON = {}, SYN = {};
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) {
    const c = BASES[i] + BASES[j] + BASES[k], aa = THREE[AA1[i * 16 + j * 4 + k]];
    CODON[c] = aa; (SYN[aa] = SYN[aa] || []).push(c);
  }
  const AMINO = Object.keys(SYN).filter(a => a !== 'STOP').sort();
  return { BASES, CODON, SYN, AMINO, rng };
})();
</script>

  function checkClaim() {
    const s = S.s, n = +s.upto;
    if (!n) return { msg: 'Choose the call number shown on the projector first.' };
    const codons = cardCodons(s.game, s.cardId), called = {};
    callList(s.game, 'classic').slice(0, n).forEach(c => { called[c.aa] = 1; });
    const valid = i => !!called[BRS.CODON[codons[i]]];
    const full = LINES.filter(L => L.every(i => s.marks[i])).length;
    const marked = Array.from({ length: 25 }, (x, i) => i).filter(i => s.marks[i]);
    const bad = {}; let nbad = 0;
    marked.forEach(i => { if (!valid(i)) { bad[i] = 1; nbad++; } });
    if (nbad) return { bad: bad, msg: nbad + ' marked ' + (nbad === 1 ? 'square does' : 'squares do') + ' not code for anything called by call ' + n + '. They are outlined with dashes. Check them on the chart, unmark them, and try again.' };
    if (s.pattern === 12 ? marked.length === 25 : full >= s.pattern) return { ok: true, n: n };
    return { msg: s.pattern === 12 ? 'The whole card is not marked yet.' : s.pattern === 2 ? 'Two full lines are needed. This card has ' + full + '.' : 'No full line of five yet.' };
  }

  /* ---------- render and events ---------- */
  function render() { const v = view(); app.innerHTML = v === 'caller' ? callerView() : v === 'card' ? cardView() : v === 'howto' ? howView() : v === 'paper' ? paperView() : homeView(); }
  app.addEventListener('click', function (ev) {
    const t = ev.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act, c = S.c, s = S.s;
    if (a === 'next') { c.n++; c.shown = false; }
    else if (a === 'show') c.shown = true;
    else if (a === 'back') { c.n = Math.max(0, c.n - 1); c.shown = c.n > 0; }
    else if (a === 'askend') c.ending = true;
    else if (a === 'keepgame') c.ending = false;
    else if (a === 'end') { const g = c.game; S.c = fresh().c; S.c.game = ''; void g; }
    else if (a === 'tab') { s.tab = t.dataset.t; fb = ''; claim = null; }
    else if (a === 'mark') { const i = t.dataset.i; s.marks[i] = !s.marks[i]; claim = null; save(); t.setAttribute('aria-pressed', String(!!s.marks[i])); t.classList.remove('wrong'); const w = $('.win'); if (w) render(); return; }
    else if (a === 'claim') claim = checkClaim();
    else if (a === 'print') { window.print(); return; }
    else if (a === 'clear') { s.marks = {}; claim = null; }
    else if (a === 'leave') { const keep = { code: s.code }; S.s = Object.assign(fresh().s, keep); claim = null; fb = ''; }
    else if (a === 'ecode') { s.code = ''; s.m = []; s.yn = []; s.done = false; fb = ''; }
    else if (a === 'echeck') {
      const cr = BRS.creature(s.code), m = cr.mut || Object.assign({ kind: 'none' }, cr.ember.copies[0]); let ok = true, sawT = false;
      m.template.forEach(function (x, i) {
        const mi = $('#em-' + i), yi = $('#yn-' + i), mv = mi.value.trim().toUpperCase(), okm = mv === m.mrna[i], oky = yi.value === (BRS.CODON[m.mrna[i]] === BRS.EMB.protein[i] ? 'y' : 'n');
        if (mv.indexOf('T') >= 0) sawT = true;
        mi.classList.toggle('ok', okm); mi.classList.toggle('bad', !okm); yi.classList.toggle('ok', oky); yi.classList.toggle('bad', !oky); ok = ok && okm && oky;
      });
      if (ok) { s.done = true; fb = ''; } else { const el = $('.say.warn'); const msg = (sawT ? 'RNA has no T. Where DNA would use T, RNA uses U. ' : '') + 'Boxes with a dashed border need another look. Fix the mRNA first, because a wrong base changes what the codon codes for.'; fb = msg; save(); if (el) el.textContent = msg; else t.parentNode.insertAdjacentHTML('afterend', '<p class="say warn" role="status">' + msg + '</p>'); return; }
    }
    save(); render();
  });
  app.addEventListener('input', function (ev) {
    const t = ev.target;
    if (t.classList.contains('mrna')) { t.value = t.value.toUpperCase().replace(/[^A-Z]/g, ''); S.s.m[+t.dataset.i] = t.value; save(); t.classList.remove('ok', 'bad'); if (t.value.length === 3) { const nx = $('#em-' + (+t.dataset.i + 1)); if (nx && !nx.value) nx.focus(); } }
  });
  app.addEventListener('change', function (ev) {
    const t = ev.target;
    if (t.classList.contains('yn')) { S.s.yn[+t.dataset.i] = t.value; t.classList.remove('ok', 'bad'); save(); }
    else if (t.id === 'upto') { S.s.upto = t.value; save(); }
    else if (t.id === 'spat') { S.s.pattern = +t.value; claim = null; save(); }
  });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const f = ev.target.dataset.form;
    if (f === 'start') { const g = norm($('#gw').value); if (g.length < 3) { $('#gw').focus(); return; } S.c = Object.assign(fresh().c, { game: g, round: 'classic', pattern: +$('#pat').value, on: true }); }
    else if (f === 'paper') { const g = norm($('#pw').value); if (g.length < 3) { $('#pw').focus(); return; } let k = Math.round(+$('#pn').value || 30); k = Math.max(2, Math.min(60, k + (k % 2))); S.p = { game: g, count: k }; }
    else if (f === 'pcheck') { S.c.pcheck = Math.max(0, Math.min(60, Math.round(+$('#pcn').value || 0))); }
    else if (f === 'join') { const g = norm($('#jw').value); if (g.length < 3) { fb = 'Type the game word exactly as the projector shows it.'; render(); return; } fb = ''; S.s = Object.assign(fresh().s, { game: g, cardId: 1000 + Math.floor(Math.random() * 9000), code: S.s.code }); }
    else if (f === 'code') { const p = BRS.parseCode($('#cc').value); if (!p.ok) { fb = p.why; render(); return; } fb = ''; S.s.code = p.code; S.s.m = []; S.s.yn = []; S.s.done = false; }
    save(); render();
  });
  window.addEventListener('hashchange', function () { fb = ''; claim = null; render(); window.scrollTo(0, 0); });
  render();
  
})();

</script>

</body></html>
