<title>Codon Bingo</title>
<meta name="description" content="Bio Tool #37. Whole-class codon bingo for iPads and paper: the projector reads a codon from template DNA, mRNA, tRNA or the amino acid, every student has a different card of 25 mRNA codons, a code on the board opens each call, and a wrong tap makes the card wait. A Mutation round reads a gene with one changed base: silent, changed or stopped. SOL Biology Unit 4, protein synthesis and mutation.">

<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a field-book page. The projector uses the whole screen; the student card sits beside its codon chart. */
:root{
  --paper:#eef1ea; --panel:#f9faf6; --ink:#1d2925; --muted:#55655d; --rule:#c8d2c7;
  --ember:#b8480f; --ember-soft:#f6dfd0; --moss:#2f6347; --moss-soft:#dbe9de;
  --ok:#236b41; --ok-soft:#d9eedf; --bad:#a8301f; --bad-soft:#f6ddd8;
  --bA:#0072b2; --bC:#f0c419; --bG:#3d4750; --bT:#d55e00; --bA-ink:#fff; --bC-ink:#14201c; --bG-ink:#fff; --bT-ink:#fff;
  --tray:#e2e7df; --tray-ink:#1d2925; --skin:#3a4147;
  --litter:#b9a57e; --leaf:#9c7f4f; --soil:#4a3a2a; --stone1:#7c8a80; --stone2:#a9a59a; --stone3:#b08f6c; --wood:#6e5238; --mossfill:#5d8a4c; --slip:#fbfaf2; --water:#3878a4;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#131a17; --panel:#1a2320; --ink:#e3eae4; --muted:#9aaca2; --rule:#2f3c36;
  --ember:#f2935a; --ember-soft:#3a2518; --moss:#86c09a; --moss-soft:#1f3327;
  --ok:#74c990; --ok-soft:#183324; --bad:#f09283; --bad-soft:#3b1d18;
  --bA:#3f9be0; --bC:#f5d547; --bG:#e1e6ea; --bT:#e8662a; --bA-ink:#0b1512; --bC-ink:#0b1512; --bG-ink:#0b1512; --bT-ink:#0b1512;
  --tray:#ccd3c9; --tray-ink:#1d2925; --skin:#3a4147;
  --litter:#4a4334; --leaf:#5f5236; --soil:#1c1611; --stone1:#56625b; --stone2:#77746c; --stone3:#7a6550; --wood:#4c3a29; --mossfill:#42683a; --slip:#e9e7da; --water:#7db3d6;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#131a17; --panel:#1a2320; --ink:#e3eae4; --muted:#9aaca2; --rule:#2f3c36;
  --ember:#f2935a; --ember-soft:#3a2518; --moss:#86c09a; --moss-soft:#1f3327;
  --ok:#74c990; --ok-soft:#183324; --bad:#f09283; --bad-soft:#3b1d18;
  --bA:#3f9be0; --bC:#f5d547; --bG:#e1e6ea; --bT:#e8662a; --bA-ink:#0b1512; --bC-ink:#0b1512; --bG-ink:#0b1512; --bT-ink:#0b1512;
  --tray:#ccd3c9; --tray-ink:#1d2925; --skin:#3a4147;
  --litter:#4a4334; --leaf:#5f5236; --soil:#1c1611; --stone1:#56625b; --stone2:#77746c; --stone3:#7a6550; --wood:#4c3a29; --mossfill:#42683a; --slip:#e9e7da; --water:#7db3d6;
  color-scheme:dark }


*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:14px 48px}
body[data-view="card"] .wrap{max-width:1180px;gap:10px;padding-block:8px 32px}
body[data-view="caller"] .wrap{max-width:none;gap:calc(var(--u)*.8);padding-block:calc(var(--u)*.5) 32px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.5rem} h2{font-size:1.45rem} h3{font-size:1.05rem;margin-top:6px}
p{margin:0;max-width:65ch} ol,ul{margin:0;padding-left:1.3rem;max-width:65ch;display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted)} .small{font-size:.9rem} .lede{font-size:1.05rem}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.top a{color:var(--ink);text-decoration:none}
body[data-view="card"] .top h1,body[data-view="caller"] .top h1{font-size:1.15rem}
body[data-view="card"] .top,body[data-view="caller"] .top{padding-bottom:4px}
.sheet,.stack{display:flex;flex-direction:column;gap:16px}
.block{background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--moss);margin:0}
button,.btn{font:700 1rem var(--body);min-height:46px;padding:10px 16px;border-radius:5px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.ghost,.btn.ghost{background:transparent;color:var(--ink)}
button.quiet,.btn.quiet{border-color:var(--rule);background:transparent;color:var(--ink);font-weight:400}
button[disabled]{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select{font:600 16px var(--mono);color:var(--ink);background:var(--paper);border:1.5px solid var(--muted);border-radius:4px;padding:9px 8px;min-height:46px;min-width:0}
label,legend{font-weight:700} .field{display:flex;flex-direction:column;gap:4px;min-width:0}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:400;min-height:44px;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.say{padding:10px 12px;border-radius:5px;background:var(--moss-soft);border:1.5px solid var(--moss)}
.say.warn{background:var(--bad-soft);border-color:var(--bad)} .say.good{background:var(--ok-soft);border-color:var(--ok)}
.gamebar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 .85rem var(--mono);color:var(--muted);align-items:center}
.gw{font-size:1.25rem;color:var(--ink);letter-spacing:.08em;padding:1px 8px;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper)}
.bt{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:3px;font:700 .95em/1 var(--mono);font-style:normal;letter-spacing:0;vertical-align:middle}
.bt.bA{background:var(--bA);color:var(--bA-ink)} .bt.bC{background:var(--bC);color:var(--bC-ink)} .bt.bG{background:var(--bG);color:var(--bG-ink)} .bt.bT{background:var(--bT);color:var(--bT-ink)}
.bt.u{border-radius:50%}
details{border:1.5px solid var(--rule);border-radius:6px;background:var(--panel);padding:10px 14px}
summary{cursor:pointer;font:700 1rem var(--display)} details>*+*{margin-top:10px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%} th,td{border:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--moss-soft)}
footer{border-top:1.5px solid var(--rule);padding-top:12px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ---------- projector: one unit, --u, scales the whole board with the screen (19.2 px at 1920 x 1080) ---------- */
:root{--u:min(1vw,1.78vh)}
.board{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:calc(var(--u)*1.6);align-items:start}
.bbar{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.6) calc(var(--u)*2);align-items:center;font:600 calc(var(--u)*1.25) var(--mono);color:var(--muted)}
.bbar .gw{font-size:calc(var(--u)*1.7)}
.bbar b{color:var(--ink)}
.callno{font:700 calc(var(--u)*1.5) var(--display);color:var(--ink);margin-left:auto}
.rows{display:flex;flex-direction:column;gap:calc(var(--u)*.55)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*.4) calc(var(--u)*1);padding:calc(var(--u)*.45) calc(var(--u)*.8);border:1.5px solid var(--rule);border-radius:6px;background:var(--paper)}
.crow .lab{grid-column:1/-1;font:600 calc(var(--u)*1.5)/1.1 var(--mono);color:var(--muted)}
.crow .lab b{color:var(--ink);font-weight:600}
.crow .lab .dir{font-size:.8em;margin-left:.5em}
.crow.dna{background:var(--moss-soft);border-color:var(--moss)}
.crow.dna .band{display:inline-block;font:700 calc(var(--u)*1.1) var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--moss);border:1.5px solid var(--moss);border-radius:3px;padding:0 .4em;margin-right:.6em;vertical-align:.1em}
.tiles{display:flex;gap:calc(var(--u)*.35);align-items:center;min-height:calc(var(--u)*3.4)}
.tiles .bt{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);font-size:calc(var(--u)*2);border-radius:calc(var(--u)*.3)}
.tiles .bt.u{border-radius:50%}
.tiles .ends{font:600 calc(var(--u)*1.3) var(--mono);color:var(--muted)}
.cover{font:700 calc(var(--u)*2.4) var(--mono);color:var(--muted);letter-spacing:.3em;min-height:calc(var(--u)*3.4);display:flex;align-items:center}
.crow .rv{font-size:calc(var(--u)*1.2);min-height:max(46px,calc(var(--u)*2.6));padding:0 calc(var(--u)*1)}
.aaname{font:700 calc(var(--u)*3.8)/1.05 var(--display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:.35em;flex-wrap:wrap;min-height:calc(var(--u)*4)}
.aaname span{font:600 .5em var(--mono);color:var(--ember);letter-spacing:.04em}
.aaname.stop{color:var(--bad)}
.notrna{font:700 calc(var(--u)*2) var(--display);color:var(--bad)}
.note{font:400 calc(var(--u)*1.15)/1.3 var(--body);color:var(--muted);padding:0 calc(var(--u)*.4)}
.codebox{display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*.4) calc(var(--u)*1.2);border:3px solid var(--ink);border-radius:8px;background:var(--panel)}
.codebox .k{font:600 calc(var(--u)*1.5)/1.15 var(--mono);color:var(--muted)}
.codebox .k b{display:block;color:var(--ink);font-size:1.15em}
.codebox .code{font:700 calc(var(--u)*6.5)/1 var(--mono);letter-spacing:.12em;color:var(--ink)}
.ribo{width:100%;height:auto;display:block}
.caption{font-size:calc(var(--u)*1.5);line-height:1.3;min-height:2.7em;max-width:none}
.called{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.4)}
.called span{font:600 calc(var(--u)*1.3) var(--mono);padding:calc(var(--u)*.2) calc(var(--u)*.5);border:1.5px solid var(--rule);border-radius:4px;display:inline-flex;gap:.4em;align-items:baseline}
.called span i{font-style:normal;font-size:.7em;color:var(--muted)}
.called span.now{border-color:var(--ember);background:var(--ember-soft)}
.called span.stopchip{color:var(--bad)}
.ctl button,.ctl .btn{font-size:max(1rem,calc(var(--u)*1.25));min-height:max(46px,calc(var(--u)*2.9));padding:0 calc(var(--u)*1.3)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 24px}
.settings .lbl{font-weight:700;display:block;margin-bottom:4px}
.rolling .bt{animation:none}
.flipin{animation:flipin .35s ease-out both}
@keyframes flipin{from{transform:rotateX(90deg);opacity:.2}to{transform:none;opacity:1}}
.arrive{animation:arrive 1.3s ease-out both}
@keyframes arrive{from{transform:translate(260px,-190px);opacity:0}to{transform:none;opacity:1}}
.slide{animation:slide .7s ease-out both}
@keyframes slide{from{transform:translateX(180px)}to{transform:none}}
.release{animation:release 1.6s ease-in .4s both}
@keyframes release{from{transform:translate(50px,34px)}to{transform:none}}
.aaname.pending{opacity:0}
@media (max-width:900px){ .board{grid-template-columns:1fr} :root{--u:min(1.9vw,1.1vh)} }

/* ---------- student card: card and chart side by side in landscape, chart under in portrait ---------- */
.cardlayout{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
@media (orientation:landscape) and (min-width:900px){ .cardlayout{grid-template-columns:minmax(0,56fr) minmax(0,44fr)} }
.cardpane{gap:8px;padding:12px}
.coderow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.coderow label{font-size:1rem}
.coderow .openstat{flex:1 1 auto;white-space:nowrap}
.coderow input.three{width:6.4em}
.coderow input{width:5.2em;font:700 1.7rem/1 var(--mono);letter-spacing:.18em;text-align:center;text-transform:uppercase;padding:6px 4px;min-height:52px}
.openstat{font:600 .95rem var(--mono);color:var(--muted)}
.openstat b{color:var(--ink)}
.msg{min-height:2.4em;display:flex;flex-direction:column;justify-content:center;font-weight:700;font-size:1rem}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.msg small{font-weight:400;font-size:.9rem;color:var(--ink)}
.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.cardhead h2{font-size:1.15rem}
.cardwrap{position:relative;width:100%;max-width:min(560px,calc(100vh - 300px));min-width:250px}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sq{aspect-ratio:1;min-height:0;padding:0;justify-content:center;font:600 clamp(1rem,4.6vw,1.45rem) var(--mono);letter-spacing:.04em;background:var(--paper);color:var(--ink);border:2px solid var(--muted);gap:2px;display:flex;align-items:center}
.sq[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
.sq[aria-pressed="true"] .bt{box-shadow:0 0 0 1.5px var(--paper)}
.sq .bt{flex:1 1 0;min-width:0;max-width:1.5em;width:auto;height:auto;aspect-ratio:1/1;font-size:.74em}
.sq.nope{background:var(--bad);border-color:var(--bad);animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.card.idle .sq{opacity:.55}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--bad-soft);background:color-mix(in srgb,var(--bad-soft) 82%,transparent);border:3px solid var(--bad);border-radius:6px;color:var(--bad);text-align:center;font-weight:700}
.lock b{font:700 5rem/1 var(--display)}
.win{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:6px;background:var(--ok);color:var(--paper);text-align:center}
.cardwrap .win{position:absolute;left:-4px;right:-4px;top:50%;transform:translateY(-50%);box-shadow:0 6px 24px rgba(0,0,0,.35);border:3px solid var(--paper);pointer-events:none}
.win b{font:700 3rem/1 var(--display);letter-spacing:.06em}
.win .wc{font:700 2rem/1.1 var(--mono);letter-spacing:.14em}
.chartpane{padding:12px;gap:6px}
.chartpane h2{font-size:1.1rem}
.chart td{font:400 .86rem/1.45 var(--mono);white-space:nowrap;padding:4px 6px} .chart th{text-align:center;font:600 .9rem var(--mono);padding:4px}
.chart th .bt{font-size:.85rem}
.chart .stop{color:var(--bad);font-weight:700} .chart .start{color:var(--ok);font-weight:700}
.chart .start i{font-style:normal;font-size:.78em;letter-spacing:.02em}
@media (orientation:portrait){ .cardwrap{max-width:min(560px,calc(100vh - 745px));margin-inline:auto} .chart td{line-height:1.38} }
@media (orientation:landscape) and (min-width:900px){ .chart td{font-size:1rem;line-height:1.62;padding:5px 9px} .chart th{font-size:1rem} }
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1.5px solid var(--bad);border-radius:5px;background:var(--bad-soft)}
@media (max-width:520px){ body{font-size:16px} .block{padding:12px} .chart td{font-size:.7rem} .chart th,.chart td{padding:3px} .sq{padding:2px;gap:1px} }
@media (prefers-reduced-motion:reduce){ .arrive,.slide,.release,.flipin,.sq.nope{animation:none}  }

/* ---------- paper cards (unchanged) ---------- */
.pcards{display:grid;gap:18px}
.pcard{background:#fff;color:#111;border:1.5px solid #333;border-radius:6px;padding:14px 16px;break-inside:avoid;page-break-inside:avoid}
.pcard .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 .95rem var(--mono);margin-bottom:8px}
.pcard .ph b{font:700 1.15rem "Bricolage Grotesque",system-ui,sans-serif}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);border:2px solid #111}
.pgrid span{aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;border:1px solid #555;font:700 1.35rem var(--mono);letter-spacing:.12em;color:#111}
.pcard .pf{display:flex;justify-content:space-between;font-size:.8rem;margin-top:6px;color:#333}
.pcheck .pgrid span.hit{background:#cfe9d6;outline:2px solid #2f6347;outline-offset:-3px}

/* ---------- the printable codon chart (#chart): outlines only, U round, start and STOP spelled out ---------- */
.pchart{background:#fff;color:#111;padding:.2in .1in;max-width:7.6in;margin:0 auto}
.pchart h2{font:700 28pt var(--display);margin:0 0 4pt}
.pchart .how{font:13pt var(--body);margin:0 0 12pt;max-width:none}
.pchart table{border-collapse:collapse;width:100%;border:2px solid #111}
.pchart th,.pchart td{border:1px solid #111;background:#fff;color:#111}
.pchart th{font:700 14pt var(--mono);text-align:center;padding:6pt}
.pchart td{font:500 14pt/2.05 var(--mono);padding:5pt 9pt;white-space:nowrap}
.pchart .pb{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border:1.6px solid #111;border-radius:3px;font:700 14pt/1 var(--mono);margin-left:3pt}
.pchart .pb.u{border-radius:50%}
.pchart .start b{font-weight:700;text-decoration:underline}
.pchart .start i,.pchart .stop{font-style:normal;font-weight:700}
.pchart .stop{letter-spacing:.02em}
.pchart .third{font:600 8.5pt var(--mono);color:#333}
.pchart .lic{font:10pt var(--body);color:#333;margin-top:10pt;max-width:none}
.pchart.half{width:5.0in;max-width:5.0in;padding:.06in .06in 0;box-sizing:border-box}
.pchart.half h2{font-size:17pt} .pchart.half .how{font-size:9.5pt;margin-bottom:6pt}
.pchart.half th{font-size:10pt;padding:3pt} .pchart.half td{font-size:10.5pt;line-height:1.88;padding:3pt 5pt}
.pchart.half .pb{font-size:10pt;width:1.5em;height:1.5em}
.pchart.half .lic{font-size:7.5pt;margin-top:5pt}

/* ---------- Mutation round ---------- */
.mstrip{display:grid;grid-template-columns:max-content repeat(var(--cols),minmax(0,1fr));gap:calc(var(--u)*.3) calc(var(--u)*.35);align-items:center;padding:calc(var(--u)*.5) calc(var(--u)*.7);border:1.5px solid var(--rule);border-radius:6px;background:var(--paper)}
.mstrip .ml{font:600 calc(var(--u)*1.1)/1.15 var(--mono);color:var(--muted);padding-right:calc(var(--u)*.5);white-space:nowrap}
.mstrip .ml b{color:var(--ink);font-weight:600}

      let g = '', pts = show.map((aa, k) => { const back = show.length - 1 - k; return { x: P - 70 * back, y: AA_Y - 8 * back + (back ? 4 : 0), aa: aa }; });
      for (let k = 1; k < pts.length; k++) g += '<line x1="' + pts[k - 1].x + '" y1="' + pts[k - 1].y + '" x2="' + pts[k].x + '" y2="' + pts[k].y + '" stroke="var(--ink)" stroke-width="5"/>';
      pts.forEach((p, k) => { g += aaBall(p.x, p.y, p.aa, k < pts.length - 1); });
      const n0 = pts[0];
      g += txt(n0.x - 44, n0.y + 10, cut ? 'N …' : 'N', ' text-anchor="end"' + DISP + ' font-size="30" fill="var(--ink)"');
      g += txt(P + 40, AA_Y + 10, 'C', DISP + ' font-size="30" fill="var(--ink)"');
      const off = cur && cur.aa === 'STOP' && (rev.trna || rev.aa);
      if (off) { g += txt(n0.x, n0.y - 48, 'let go', ' text-anchor="middle"' + MONO + ' font-size="20" fill="var(--bad)"'); s += '<g transform="translate(-50 -34)" opacity=".85"><g' + (anim.released ? '' : ' class="release"') + '>' + g + '</g></g>'; anim.released = true; }
      else s += '<g>' + g + '</g>';
    }
    if (cur && (rev.trna || rev.aa)) {
      const arr = anim.arrived ? '' : 'arrive'; anim.arrived = true;
      if (cur.aa === 'STOP') s += '<g class="' + arr + '"><rect x="' + (A - 48) + '" y="' + (AA_Y + 20) + '" width="96" height="' + (AC_Y - AA_Y - 14) + '" rx="28" fill="var(--bad-soft)" stroke="var(--bad)" stroke-width="2.5"/>' + txt(A, AA_Y + 92, 'release', ' text-anchor="middle"' + MONO + ' font-size="20" fill="var(--ink)"') + txt(A, AA_Y + 116, 'factor', ' text-anchor="middle"' + MONO + ' font-size="20" fill="var(--ink)"') + '</g>';
      else {
        let inner = (rev.trna ? svgCodon(A, AC_Y - T, anti(cur.codon), false) : svgCover(A, AC_Y - T)) + (rev.aa ? aaBall(A, AA_Y, cur.aa, false) : '<circle cx="' + A + '" cy="' + AA_Y + '" r="32" fill="var(--panel)" stroke="var(--ember)" stroke-width="2.5" stroke-dasharray="6 5"/>' + txt(A, AA_Y + 10, '?', ' text-anchor="middle"' + DISP + ' font-size="30" fill="var(--muted)"'));
        if (rev.trna && rev.mrna) for (let i = 0; i < 3; i++) { const x = A - CW / 2 + i * (T + G) + T / 2; inner += '<path d="M' + (x - 7) + ' ' + (AC_Y + 6) + ' v' + (MRNA_Y - AC_Y - 18) + ' M' + (x + 7) + ' ' + (AC_Y + 6) + ' v' + (MRNA_Y - AC_Y - 18) + '" stroke="var(--ink)" stroke-width="3"/>'; }
        inner += txt(A + CW / 2 + 20, AC_Y - 14, 'anticodon', MONO + ' font-weight="600" font-size="26" fill="var(--ink)"') + txt(A + CW / 2 + 20, AC_Y + 16, '· on the tRNA', MONO + ' font-weight="600" font-size="26" fill="var(--ink)"');
        s += trnaBody(A, arr, inner);
      }
    }
    return s + '</svg>';
  }

  function rollTiles() {
    const els = Array.from(document.querySelectorAll('.tiles.rolling'));
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!els.length || reduce) { rollT = null; render(); return; }
    const truth = els.map(e => Array.from(e.querySelectorAll('.bt')).map(b => b.textContent));
    const t0 = performance.now(), letters = ['A', 'C', 'G', 'U'];
    clearInterval(rollT);
    rollT = setInterval(function () {
      const dt = performance.now() - t0;
      els.forEach(function (e, k) {
        const dna = e.closest('.dna'), bs = e.querySelectorAll('.bt');
        bs.forEach(function (b, i) {
          let x = dt >= 500 * (i + 1) ? truth[k][i] : (dna ? 'ACGT' : 'ACGU')[Math.floor(Math.random() * 4)];
          b.textContent = x; b.className = 'bt b' + (x === 'U' ? 'T u' : x);
        });
      });
      if (dt >= 1500) { clearInterval(rollT); rollT = null; render(); }
    }, 70);
    void letters;
  }

    save(); render();
  });
  app.addEventListener('input', function (ev) {
    const t = ev.target;
    if (t.id === 'cc') { const n = S.s.round === 'mut' ? 3 : 2; t.value = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, n); if (t.value.length === n) t.form.requestSubmit ? t.form.requestSubmit() : t.form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true })); }
  });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const f = ev.target.dataset.form, s = S.s;
    if (f === 'start') { const g = norm($('#gw').value); if (g.length < 3) { $('#gw').focus(); return; } const k = S.c; S.c = Object.assign(fresh().c, { game: g, on: true, preset: k.preset, lock: k.lock, win: k.win, round: k.round, mset: k.mset }); S.c.rev = revFor(S.c.preset); if (S.c.round === 'mut') { S.c.m = { plan: mPlan(g, k.mset), g: 1, phase: 'normal', play: 0, step: 0, showT: false, tally: {}, classN: k.m ? k.m.classN : '' }; anim = { n: -1, arrived: false, released: false }; } }
    else if (f === 'paper') { const g = norm($('#pw').value); if (g.length < 3) { $('#pw').focus(); return; } let k = Math.round(+$('#pn').value || 30); k = Math.max(2, Math.min(60, k + (k % 2))); S.p = { game: g, count: k }; }
    else if (f === 'pcheck') { const m = String($('#pcn').value).toUpperCase().replace(/\s/g, '').match(/^([PD])?0*(\d{1,2})$/); S.c.pcheck = m && +m[2] >= 1 && +m[2] <= 60 ? (m[1] || 'P') + (+m[2] < 10 ? '0' : '') + (+m[2]) : ''; }
    else if (f === 'join') { const g = norm($('#jw').value); if (g.length < 3) { fb = { kind: 'bad', text: 'Type the game word exactly as the projector shows it.' }; render(); return; } fb = null; S.s = Object.assign(fresh().s, { game: g, cardId: 1000 + Math.floor(Math.random() * 9000) }); }
    else if (f === 'code' && s.round === 'mut') { if (mCode($('#cc').value)) return; }
    else if (f === 'code') {
      const d = decode(s.game, $('#cc').value);
      if (!d) fb = { kind: 'bad', text: mcodeTable(s.game).pre[cleanCode($('#cc').value).slice(0, 2)] ? 'That looks like a Mutation round code. Tap Mutation round at the top.' : 'That code isn’t from this game. Check the board and your game word.' };
      else if (d.call < s.hi) fb = { kind: 'bad', text: 'That code is from an earlier call.' };
      else { const before = s.hi && hasWin(s.marks, s.win); s.hi = d.call; s.lock = d.lock; s.win = d.win; fb = null; save(); render(); if (!before && hasWin(s.marks, s.win)) chime('bingo'); return; }
    }
    save(); render();
  });
  app.addEventListener('change', function (ev) { const t = ev.target; if (t.id === 'mclassn' && S.c.m) { S.c.m.classN = String(Math.max(0, Math.min(60, Math.round(+t.value || 0))) || ''); save(); render(); } });
  window.addEventListener('hashchange', function () { fb = null; render(); window.scrollTo(0, 0); tickLock(); });
  render(); tickLock();
  /* for the build and test scripts only */
  window.CodonBingo = { callList: callList, cardCodons: cardCodons, codeFor: codeFor, decode: decode, hasWin: hasWin, LINES: LINES, LOCKS: LOCKS, WINS: WINS, CODEALPH: CODEALPH, played: played, templ: templ, anti: anti, FULL: FULL, printChart: printChart, mutGene: mutGene, mutRead: mutRead, mPlan: mPlan, mcodeFor: mcodeFor, mdecode: mdecode, mCalledSet: mCalledSet, mGoneSet: mGoneSet, MK3: MK3 };
})();
