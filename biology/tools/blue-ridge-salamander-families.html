<script>
/* Blue Ridge Salamander Project genome engine. v3 (two alleles, one spelling per allele), built 2026-11-11.
   FROZEN for edition 2026-27 at genome mark D3Y-KTT (Reid's decision, 2026-11-15). This school year, do not change genes,
   alleles, sites, odds, seeds or stamps: every student's Creature Code, stamps and keeper code depend on them. Wording
   and comments may change. After any edit, fingerprint() must still return D3Y-KTT and TF-7CBW4 must still give
   final stamp AT7-15M and keeper code TF-7CBW4-AT7. Any rebuild waits for the end of the project.
   A Creature Code regenerates the same genome every time. No server, no student data.
   Every gene draws from its own seeded stream (code + gene id), so adding a gene later
   never changes a gene students already decoded.

   What changed from v2 (decisions of 11/11, 1:04 to 1:40 pm):
   - One DNA spelling per allele for the whole ridge. Any two alleles of a gene differ at exactly one base.
   - Within one animal, the father's copy of a chromosome uses the mother's copy's filler DNA and gene
     positions, and differs only at the allele letters. Filler and positions stay unique to each animal.
   - The drawn set is the mother's: chromosomes 1 to 14 and the X she gave (15 strips). Males get a 16th
     strip, the Y from the father. A female's second X is a partner, not a strip.
   - Power gene (four codominant alleles) in place of Breath.
   - The stamp carries the edition and which genes are done. Keeper code = Creature Code + first three
     characters of the final stamp. */
const BRS = (function () {
  'use strict';
  const VERSION = 'v3 frozen 2026-11-15';
  const EDITION = { id: '2026-27', mark: 'A', label: 'Edition 2026-27' };
  const EDITIONS = { A: EDITION };
  /* Both rules were settled with Reid on 11/11 (decisions log). They stay switches so the checks can run each way. */
  const DEFAULTS = {
    emberOnMotherCopy: true, // a new mutation sits on the mother's copy of chromosome 9; the father's copy is the ridge reference
    toxinGraded: true        // TT strong toxin, Tt mild, tt none (decided 2:17 pm)
  };
  const MUTATION_ODDS = 0.5; // a second die roll at the rock: 1 to 3 means the animal carries a new mutation (decided 2:13 pm)
  const ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // 31 characters, no 0 O 1 I L

  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rng(seed) {
    let a = hashStr(seed);
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- Three sites, three populations. Every fact here has a source in the session record. ---------- */
  const SITES = [
    { id: 'TF', die: [1, 2], pop: 'Talus Firetail', place: 'Hawksbill', region: 'Shenandoah National Park · Page and Madison counties', elev: '4,050 ft', lat: 38.555, lon: -78.395,
      rocks: ['greenstone slab', 'greenstone block', 'mossy greenstone'],
      text: 'The rock is greenstone, basalt lava changed by heat and pressure, and on the steep sides it breaks into slopes of loose blocks called talus. Balsam fir grows at the summit, one of the few places in the park where it does. The real Shenandoah salamander lives on this mountain and two others, and nowhere else on Earth.',
      legend: '' },
    { id: 'CE', die: [3, 4], pop: 'Cinder Eft', place: 'James River water gap', region: 'Blue Ridge Parkway at Otter Creek', elev: '649 ft', lat: 37.555, lon: -79.367,
      rocks: ['flat river stone', 'river cobble', 'mossy boulder'],
      text: 'The James River cuts straight through the Blue Ridge here, and the bank is the lowest point on the whole Blue Ridge Parkway. Stone locks from the old James River and Kanawha Canal still stand beside the water. In the mountains to the south, the real Peaks of Otter salamander lives in old hardwood forest in three Virginia counties and nowhere outside the state.',
      legend: '' },
    { id: 'HE', die: [5, 6], pop: 'Highland Emberback', place: 'Mount Rogers', region: 'Grayson and Smyth counties', elev: '5,729 ft', lat: 36.66, lon: -81.545,
      rocks: ['rhyolite slab', 'rhyolite block', 'mossy rhyolite'],
      text: 'Mount Rogers is the highest point in Virginia. Its rock is rhyolite, left by volcanoes that erupted here long ago, and a dark forest of spruce and Fraser fir covers the top. In the rivers of this corner of the state lives the real eastern hellbender, a salamander more than two feet long that local people call the snot-otter and the devil dog.',
      legend: '' }
  ];
  const site = id => SITES.find(s => s.id === id);
  const siteForRoll = n => SITES.find(s => s.die.indexOf(n) >= 0);

  /* ---------- Creature Codes: two site letters + four characters + one check character ---------- */
  function checkChar(six) {
    let sum = 0;
    for (let i = 0; i < six.length; i++) sum += ALPHA.indexOf(six[i]) * (i + 1);
    return ALPHA[sum % 31];
  }
  function parseCode(raw) {
    const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.length !== 7) return { ok: false, why: 'A Creature Code is two site letters and five characters, like TF-7K3QM.' };
    const pre = s.slice(0, 2), body = s.slice(2);
    if (!site(pre)) return { ok: false, why: 'A Creature Code starts with TF, CE or HE, the letters of the site where it was found.' };
    for (const ch of body) if (ALPHA.indexOf(ch) < 0) return { ok: false, why: 'Codes never use 0, 1, I, L or O. Look at the slip again.' };
    if (checkChar(pre + body.slice(0, 4)) !== body[4]) return { ok: false, why: 'That code has a typo in it. Check each character against the slip.' };
    return { ok: true, code: pre + '-' + body, site: pre };
  }
  function codeFrom(rand, siteId) {
    let four = '';
    for (let i = 0; i < 4; i++) four += ALPHA[Math.floor(rand() * 31)];
    return siteId + '-' + four + checkChar(siteId + four);
  }
  /* The second die roll. 1 to 3: the animal carries a new mutation. 4 to 6: it does not.
     The page draws codes until the animal behind one matches the roll, so the code alone still rebuilds the animal. */
  const mutationForRoll = n => n >= 1 && n <= 3;
  function codeForRolls(rand, siteRoll, mutationRoll) {
    const s = siteForRoll(siteRoll); if (!s || !(mutationRoll >= 1 && mutationRoll <= 6)) return null;
    for (;;) { const c = codeFrom(rand, s.id); if (hasMutation(c) === mutationForRoll(mutationRoll)) return c; }
  }
  function batch(word, n, siteId) {
    const r = rng('batch|' + String(word).trim().toLowerCase() + '|' + siteId);
    const out = [];
    while (out.length < n) { const c = codeFrom(r, siteId); if (out.indexOf(c) < 0) out.push(c); }
    return out;
  }

  /* ---------- The universal genetic code ---------- */
  const BASES = 'UCAG';
  const AA1 = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
  const THREE = { F: 'Phe', L: 'Leu', S: 'Ser', Y: 'Tyr', '*': 'STOP', C: 'Cys', W: 'Trp', P: 'Pro', H: 'His', Q: 'Gln', R: 'Arg', I: 'Ile', M: 'Met', T: 'Thr', N: 'Asn', K: 'Lys', V: 'Val', A: 'Ala', D: 'Asp', E: 'Glu', G: 'Gly' };
  const CODON = {}, SYN = {};
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) {
    const c = BASES[i] + BASES[j] + BASES[k], aa = THREE[AA1[i * 16 + j * 4 + k]];
    CODON[c] = aa; (SYN[aa] = SYN[aa] || []).push(c);
  }

        const hit = el('rect', { x: GX(i) - 27, y: 8, width: 54, height: 175, fill: 'transparent' }, svg);
        if (pad) { hit.setAttribute('data-act', 'cell'); hit.setAttribute('data-i', ROLL_ORDER.findIndex(x => x[0] === who && x[1] === i)); hit.style.cursor = 'pointer'; }
      }
      R.svgs[who] = svg;
    });
    RU = R;
    if (pad) ['mother', 'father'].forEach(function (who) {            // the two extra dice can be fixed too
      [0, 1].forEach(function (j) {
        const x = $('#x-' + who + '-' + j); if (!x) return;
        x.setAttribute('data-act', 'cell'); x.setAttribute('data-i', ROLL_ORDER.findIndex(y => y[0] === who + 'Power' && y[1] === j));
        x.setAttribute('role', 'button'); x.setAttribute('tabindex', '0'); x.setAttribute('aria-label', (who === 'mother' ? 'Mother' : 'Father') + ', extra die ' + (j + 1) + ': tap to fix'); x.style.cursor = 'pointer';
      });
    });
    /* draw what is already rolled, with no motion */
    document.querySelectorAll('.gchr').forEach(g => g.classList.add('still'));
    ['mother', 'father'].forEach(function (who) {
      for (let i = 0; i < 15; i++) {
        if (fromCode) place1(who, i, null, sentFromCode[who][i]);
        else place1(who, i, E.faces[who][i] || 0, null);
      }
      [0, 1].forEach(j => paintExtra(who, j, fromCode ? null : E.faces[who + 'Power'][j]));
    });
    requestAnimationFrame(() => document.querySelectorAll('.gchr').forEach(g => g.classList.remove('still')));
    paintControls(D, e);
  }
  /* face 0 = not rolled yet; sent overrides the face (an egg brought back from its code) */
  function place1(who, i, face, sent) {
    const R = RU, pair = R.groups[who][i], dg = R.dice[who][i];
    const chosen = sent != null ? sent : face ? (face <= 3 ? 0 : 1) : -1;
    const xo = R.xo[who][i], st = xo ? R.xs[who][xo.k] : 0;
    if (xo) xo.mark.setAttribute('opacity', chosen >= 0 && st > 0 ? 1 : 0);
    pair.forEach(function (c) {
      const home = 'translate(' + (GX(i) + (c.k ? 9 : -9)) + 'px, ' + GTOP + 'px)', tray = 'translate(' + GX(i) + 'px, ' + TRAY + 'px)';
      const on = chosen === c.k;
      c.g.style.transform = on ? tray : home;
      c.g.style.opacity = chosen < 0 || on ? 1 : 0.3;
      c.g.querySelector('.halo').setAttribute('opacity', on ? 0.9 : 0);
      if (c.tip) { const mixed = on && st === 2; c.tip.setAttribute('opacity', mixed ? 1 : 0); if (c.far.tx) c.far.tx.textContent = mixed ? c.far.other : c.far.own; }
    });
    while (dg.firstChild) dg.removeChild(dg.firstChild);
    if (face) { dieInto(dg, face, 0, 0, 26); dg.setAttribute('opacity', 1); }
    else if (sent != null) { dieInto(dg, 0, 0, 0, 26); const t = el('text', { x: 0, y: 4, 'font-size': 9, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono, monospace', fill: '#1d2925', 'font-weight': 700 }, dg); t.textContent = sent ? '4–6' : '1–3'; dg.setAttribute('opacity', 1); }
    else dg.setAttribute('opacity', 0);
  }
  function paintExtra(who, j, face) {
    const x = $('#x-' + who + '-' + j); if (!x) return;
    x.innerHTML = face ? dieSVG(face, 30) : '<span class="empty"></span>';
    const E = fam().eggs[RU.e], p = E.faces ? E.faces[who + 'Power'] : [0, 0], w = $('#xw-' + who);
    if (w) w.innerHTML = p[0] && p[1] ? (p[0] === 6 && p[1] === 6 ? '<b class="ok">Double six: the power gene changes in this ' + (who === 'mother' ? 'egg' : 'sperm') + '.</b>' : 'No double six. The power gene does not change.') : '';
  }
  function tumble(dg, face, done) {               // the die shows a few faces and lands; a third of a second
    if (REDUCED) { done(); return; }
    let n = 0;
    const step = function () {
      while (dg.firstChild) dg.removeChild(dg.firstChild);
      dieInto(dg, n < 4 ? 1 + Math.floor(Math.random() * 6) : face, 0, 0, 26); dg.setAttribute('opacity', 1);
      dg.style.transform = dg.style.transform.replace(/ rotate\([^)]*\)/, '') + (n < 4 ? ' rotate(' + (n * 70 - 100) + 'deg)' : '');
      if (n++ < 4) setTimeout(step, 70); else done();
    };
    step();
  }
  function setFace(idx, face, animate, then) {
    const f = fam(), E = f.eggs[RU.e], x = ROLL_ORDER[idx], who = x[0].replace('Power', ''), isX = x[0].indexOf('Power') > 0;
    const finish = function () {
      E.faces[x[0]][x[1]] = face;
      if (isX) paintExtra(who, x[1], face); else place1(who, x[1], face, null);
      if (usesPad(f, RU.e)) { if (E.rolls) E.rolls = null; }      /* typed dice: the egg is made on "Make the egg", after a last look */
      else if (filled(E) === 34) makeEgg(E);
      else if (E.rolls) { E.rolls = null; }
      let nx = idx + 1; while (nx < 34 && E.faces[ROLL_ORDER[nx][0]][ROLL_ORDER[nx][1]]) nx++;
      if (nx >= 34) { nx = ROLL_ORDER.findIndex(y => !E.faces[y[0]][y[1]]); if (nx < 0) nx = 34; }
      E.cur = nx; save(); paintControls(derive(), RU.e); if (then) then();
    };
    if (animate && !isX) tumble(RU.dice[who][x[1]], face, finish);
    else finish();
  }
  function paintControls(D, e) {
    const f = D.f, E = f.eggs[e], pad = usesPad(f, e), breed = isBreed(f) && e === 0, el2 = $('#rollpad'), res = $('#rollres');
    if (!el2) return;
    const fromCode = !!(E.code && !E.rolls), n = fromCode ? 34 : filled(E), cur = E.cur;
    const nowWho = cur < 34 ? ROLL_ORDER[cur][0].replace('Power', '') : null;
    if (nowWho && RU.lastWho && nowWho !== RU.lastWho) { const pn = document.querySelector('.gpanel[data-who="' + nowWho + '"]'); if (pn && pn.scrollIntoView) pn.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' }); }
    RU.lastWho = nowWho;
    ['mother', 'father'].forEach(function (who) {
      const x = cur < 34 ? ROLL_ORDER[cur] : null, ring = RU.ring[who];
      if (x && x[0] === who && !fromCode) { ring.setAttribute('x', GX(x[1]) - 26); ring.setAttribute('opacity', 1); } else ring.setAttribute('opacity', 0);
    });
    document.querySelectorAll('.xd').forEach(d => d.classList.toggle('sel', !fromCode && cur < 34 && d.id === 'x-' + ROLL_ORDER[cur][0].replace('Power', '') + '-' + ROLL_ORDER[cur][1] && ROLL_ORDER[cur][0].indexOf('Power') > 0));
    const ready = pad && n === 34 && !E.rolls;
    let h = '';
    if (fromCode) h = '';
    else if (breed) h = n < 34 ? '<button type="button" data-act="record">Read the program’s record</button><span class="small">' + n + ' of 34</span>' : '';
    else if (pad) h = (ready ? '<button type="button" class="make" data-act="makeegg">Make the egg</button><span class="small">All 34 dice are in. Check them against your Field Sheet. Tap any pair or extra die to fix it, then make the egg.</span><span class="grow"></span>' : '') + [1, 2, 3, 4, 5, 6].map(k => '<button type="button" class="face" data-act="face" data-n="' + k + '" aria-label="' + k + '">' + dieSVG(k, 40) + '</button>').join('') + '<span class="small">' + (cur < 34 ? (ROLL_ORDER[cur][0].indexOf('mother') === 0 ? 'Mother, ' : 'Father, ') + (ROLL_ORDER[cur][0].indexOf('Power') > 0 ? 'extra die ' + (ROLL_ORDER[cur][1] + 1) : pairLabel(ROLL_ORDER[cur][1], D.M).replace(/^XX$|^XY$/, 'sex pair').replace(/^(\d+)$/, 'pair $1')) + ' · ' : '') + n + ' of 34' + (n === 34 ? ' · tap a pair or an extra die to fix a roll' : '') + '</span>' +
      (n < 34 ? '<details class="small"><summary>No dice at your table?</summary><button type="button" class="ghost small" data-act="usevirtual">Let the page roll egg 1</button></details>' : '');
    else h = n < 34 ? '<button type="button" data-act="roll1">Roll ' + (cur < 34 ? (ROLL_ORDER[cur][0].indexOf('Power') > 0 ? 'the extra die' : 'pair ' + pairLabel(ROLL_ORDER[cur][1], D.M).replace(/^XX$|^XY$/, 'Sex')) : '') + '</button><button type="button" class="ghost" data-act="rollrest">Roll the rest</button><span class="small">' + n + ' of 34</span>' : '';
    el2.innerHTML = h; el2.classList.toggle('hidden', !h);
    const b = E.rolls || E.code ? F.makeBaby(D.M, D.D, E.rolls || { egg: E.code }) : null;
    const xw = b && b.ok ? b.crossings.map(x => 'the ' + (x.givenBy === 'mother' ? 'mother’s' : 'father’s') + ' ' + (x.chr === 'X' ? 'X' : 'chromosome ' + x.chr)) : [];
    res.innerHTML = b && b.ok ? 'These rolls made egg ' + (e + 1) + ': <span class="eggcode">' + b.egg + '</span>' + (b.newPower.length ? ' <b>A double six changed the power gene.</b>' : '') + (xw.length ? ' Crossing over: ' + xw.join(' and ') + ' went in mixed.' : '') + (e === 0 && pad ? '<br><span class="small"><button type="button" class="quiet" data-act="reroll">Start egg 1 again</button> if many rolls were typed wrong.</span>' : '') : '';
    const nb = $('[data-act="next"]'); if (nb) nb.disabled = !(E.rolls || E.code);
  }
  function rollNext(animate, then) {
    const E = fam().eggs[RU.e]; if (E.cur >= 34) { if (then) then(); return; }
    const x = ROLL_ORDER[E.cur], face = isBreed(fam()) && RU.e === 0 ? BREED.egg1[x[0]][x[1]] : 1 + Math.floor(Math.random() * 6);
    setFace(E.cur, face, animate, then);
  }
  function rollRest() {
    if (RU.busy) return; RU.busy = 1;
    const go = function () { const E = fam().eggs[RU.e]; if (!RU || E.cur >= 34) { RU.busy = 0; return; } rollNext(false, function () { RU.timer = setTimeout(go, REDUCED ? 0 : 110); }); };
    go();
  }

  /* ---------- the whole family, and the end ---------- */
  function familyHtml(D) {
    let h = '<section class="block"><h2>The family</h2><p class="say">Two parents, four babies. Read across a row to see which allele each baby got from each parent.</p><div class="scroll"><table class="tbl"><thead><tr><th>Gene</th><th>Mother</th><th>Father</th>' + D.babies.map((b, i) => '<th>Egg ' + (i + 1) + '<br>' + kidW(b) + '</th>').join('') + '</tr></thead><tbody>';
    ['STR', 'COL', 'TOX', 'SPT', 'GLO', 'CLW', 'GIL', 'REG', 'POW', 'AUR', 'VOC', 'VIS'].forEach(function (gid) {
      h += '<tr><td>' + SHORT[gid] + '</td><td class="a m">' + F.entry(D.M, gid).genotype + '</td><td class="a d">' + F.entry(D.D, gid).genotype + '</td>';
      D.babies.forEach(function (b) {
        const e = F.entry(b, gid), mo = e.copies.find(c => c.from === 'from the mother'), fa = e.copies.find(c => c.from === 'from the father');
        h += '<td><span class="al m">' + esc(mo.allele.s) + '</span>' + (fa ? '<span class="al d">' + esc(fa.allele.s) + '</span>' : '<span class="al d">Y</span>') + '<br><span class="small">' + esc(F.traitWord(b, gid)) + '</span></td>';
      });
      h += '</tr>';
    });
    h += '<tr><td>Length</td><td class="a m">' + D.M.plus + ' of 6</td><td class="a d">' + D.D.plus + ' of 6</td>' + D.babies.map(b => '<td>' + b.plus + ' of 6</td>').join('') + '</tr>';
    return h + '</tbody></table></div></section>';
  }
  function doneHtml(D) {
    const f = D.f, res = id => { const s = f.mc[id]; return !s ? '' : s.restored ? 'brought back' : s.done && s.tries === 0 ? 'right on the first try' : s.done ? 'right on the second try' : 'shown'; };
    let h = '<section class="block"><h2>Your family is complete</h2><p class="say shot">Keep these codes on your Family Field Sheet. Take a screenshot now: press the top button and volume up together (on an iPad with a Home button, the top button and Home). The two keeper codes and four egg codes bring the whole family back on any iPad.</p><div class="cards">';
    D.babies.forEach((b, i) => { h += '<div class="kid"><b>Egg ' + (i + 1) + '</b><span class="eggcode" style="font-size:1.15rem">' + b.egg + '</span><span>' + kidW(b) + ', ' + F.traitWord(b, 'COL') + ', ' + F.traitWord(b, 'STR') + '</span>' + (b.newPower.length ? '<span class="ok">new power: ' + esc(b.newPower[0].toLabel) + '</span>' : '') + (b.albino ? '<span class="ok">albino</span>' : '') + '<a class="see3d small" href="' + esc(link3d(b)) + '">See it in 3D</a><a class="seek small" href="' + esc(linkKaryo(b)) + '">Karyotype card</a></div>'; });
    h += '</div><table class="tbl"><tbody>' + ['c1', 'c2', 'c3', 'c4'].map(id => '<tr><td>Check ' + id.slice(1) + '</td><td>' + res(id) + '</td></tr>').join('') +
      [0, 1, 2, 3].map(e => { const s = predScore(D, e); return '<tr><td>Egg ' + (e + 1) + ' predictions</td><td>' + s.first + ' of ' + s.n + ' right on the first try</td></tr>'; }).join('') + '</tbody></table>' +
      '<div class="btnrow"><button type="button" data-act="copy">Copy my codes</button><button type="button" class="ghost" data-act="back">&larr; Back</button><button type="button" class="ghost" data-act="newfam">Start another family</button></div></section>';
    return h;
  }
  function codesText(D) {
    let s = 'Salamander Family\nMother: ' + D.M.keeper + '\nFather: ' + D.D.keeper + '\n';
    D.babies.forEach((b, i) => { if (b && b.ok) s += 'Egg ' + (i + 1) + ': ' + b.egg + ' (' + kidW(b) + ')\n'; });
    return s;
  }

  /* ---------- events ---------- */
  app.addEventListener('input', function (e) {
    const t = e.target;
    if (t.id === 'ka' || t.id === 'kb') { pairIn[t.id === 'ka' ? 'a' : 'b'] = t.value; const r = readKeeperBox(t.value); $(t.id === 'ka' ? '#la' : '#lb').innerHTML = animalLine(r); pairMsg.start = ''; const ms = $('#ms'); if (ms) ms.innerHTML = ''; }
    else if (/^eg\d$/.test(t.id)) pairIn.eggs[+t.id[2]] = t.value;
  });
  document.addEventListener('click', function (e) {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.getAttribute('data-act'), f = fam(), D = f ? derive() : null;
    if (act === 'copy' && D) { const txt = codesText(D); try { navigator.clipboard.writeText(txt).then(() => { b.textContent = 'Copied'; }, () => { prompt('Copy your codes:', txt); }); } catch (x) { prompt('Copy your codes:', txt); } return; }
    if (act === 'own') { pairIn.a = ownAnimal() || ''; pairScreen(); return; }
    if (act === 'start') { pairIn.a = ($('#ka') || {}).value || pairIn.a; pairIn.b = ($('#kb') || {}).value || pairIn.b; const w = startFamily(pairIn.a, pairIn.b); if (w) { pairMsg.start = '<span class="bad">' + esc(w) + '</span>'; pairScreen(); } else { pairMsg.start = ''; render(true); } return; }
    if (act === 'bringback') { const w = startFamily(($('#ka') || {}).value || '', ($('#kb') || {}).value || '', [0, 1, 2, 3].map(i => ($('#eg' + i) || {}).value || '')); if (w) { pairMsg.back = '<span class="bad">' + esc(w) + '</span>'; pairScreen(); } else { pairMsg.back = ''; render(true); } return; }
    if (act === 'demo') { const mom = F.partnerFor('TF-7CBW4'); const k = famKey(mom.keeper, 'TF-7CBW4-AT7'); if (!ST.fams[k]) { ST.fams[k] = blankFam(mom.keeper, 'TF-7CBW4-AT7'); const r = BRS.rng('projector-demo'); ST.fams[k].eggs.forEach(E => { E.rolls = F.rollDice(r); E.faces = JSON.parse(JSON.stringify(E.rolls)); E.cur = 34; }); } ST.cur = k; save(); setPos(ORDER.findIndex(x => x.e === 0 && x.s === 'mm')); return; }
    if (act === 'breed') { pairIn.a = BREED.mother; pairIn.b = BREED.father; const w = startFamily(BREED.mother, BREED.father); if (!w) render(true); return; }
    if (act === 'open') { ST.cur = b.getAttribute('data-k'); save(); render(true); return; }
    if (act === 'newfam') { ST.cur = null; save(); pairIn = { a: '', b: '', eggs: ['', '', '', ''] }; render(true); return; }
    if (!f) return;
    const o = ORDER[f.pos];
    if (act === 'next') { if (canNext(D, o)) setPos(f.pos + 1); return; }
    if (act === 'back') { if (f.pos === 0) { ST.cur = null; save(); render(true); } else setPos(f.pos - 1); return; }
    if (RU && o.s === 'roll') {
      const E = f.eggs[o.e];
      if (act === 'cell') { E.cur = +b.getAttribute('data-i'); save(); paintControls(D, o.e); return; }
      if (act === 'face') { if (E.cur < 34) setFace(E.cur, +b.getAttribute('data-n'), true); return; }
      if (act === 'makeegg') { if (filled(E) === 34) { crossOf(D, E, o.e); makeEgg(E); save(); paintControls(derive(), o.e); } return; }
      if (act === 'roll1') { if (!RU.busy) rollNext(true); return; }
      if (act === 'rollrest' || act === 'record') { rollRest(); return; }
      if (act === 'usevirtual') { E.virtual = true; save(); render(false); return; }
      if (act === 'reroll') { f.eggs[o.e] = blankEgg(); save(); render(false); return; }
    }
    if (act === 'pick' || act === 'show') {
      const id = b.getAttribute('data-id'), st = f.mc[id] || (f.mc[id] = { tries: 0, done: false, shown: false, wrong: {} }), def = checkDef(id, D);
      if (act === 'show') st.shown = true;
      else { const k = +b.getAttribute('data-k'); st.last = k; if (def.opts[k].ok) st.done = true; else { st.tries++; st.wrong[k] = true; } }
      save(); const y = window.scrollY; render(false); window.scrollTo(0, y); return;
    }
    if (act === 'pred') {
      const g = b.getAttribute('data-gene'), E = f.eggs[o.e], st = E.pred[g] || (E.pred[g] = { tries: 0, done: false, shown: false, wrong: {} }), d = predDef(D.babies[o.e], g), k = +b.getAttribute('data-k');
      if (k === d.right) st.done = true; else { st.tries++; st.wrong[k] = true; if (st.tries >= 2) st.shown = true; }
      save(); const y = window.scrollY; render(false); window.scrollTo(0, y); return;
    }
  });
  /* keys: the arrow keys step a scene for a projector; at a scene's end they move to the next screen */
  window.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const f = fam(); if (!f) return;
    const o = ORDER[f.pos];
    if (e.key === 'ArrowRight') { e.preventDefault(); if (PLAYER && PLAYER.fwd()) return; const D = derive(); if (canNext(D, o)) setPos(f.pos + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (PLAYER && PLAYER.back()) return; if (f.pos > 0) { setPos(f.pos - 1); if (PLAYER) PLAYER.jumpEnd(); } }
    else if (e.key === ' ' && PLAYER) { e.preventDefault(); PLAYER.again(); }
    else if (e.key >= '1' && e.key <= '4') { const s = ['mm', 'mf', 'fert', 'hatch'][+e.key - 1], i = ORDER.findIndex(x => x.e === o.e && x.s === s); const D = derive(); if (i >= 0 && D.babies[o.e] && D.babies[o.e].ok) setPos(i); }
  });

  /* level switch for a teacher, as in the Toolbox */
  if (TEACHER) {
    const d = document.createElement('div'); d.className = 'btnrow'; d.innerHTML = '<span class="small">Level:</span><button type="button" class="small" data-level="advanced">SOL Advanced</button><button type="button" class="small ghost" data-level="general">SOL General</button><span class="small">Egg 1 dice:</span><button type="button" class="small" data-dice="real">Real dice</button><button type="button" class="small ghost" data-dice="virtual">Page dice</button>';
    $('#bar').appendChild(d);
    const paint = () => { d.querySelectorAll('[data-level]').forEach(x => x.classList.toggle('ghost', x.getAttribute('data-level') !== LEVEL)); d.querySelectorAll('[data-dice]').forEach(x => x.classList.toggle('ghost', x.getAttribute('data-dice') !== diceMode)); };
    d.addEventListener('click', function (e) {
      const x = e.target.closest('[data-level],[data-dice]'); if (!x) return;
      if (x.hasAttribute('data-level')) LEVEL = x.getAttribute('data-level'); else diceMode = x.getAttribute('data-dice');
      paint(); try { const u = new URL(location.href); u.searchParams.set('level', LEVEL); if (diceMode === 'virtual') u.searchParams.set('dice', 'virtual'); else u.searchParams.delete('dice'); history.replaceState(null, '', u.toString()); } catch (z) { /* ignore */ } render(false); });
    paint();
  }
  if (ST.cur && !ST.fams[ST.cur]) ST.cur = null;
  render(false);
  window.__brsf = { ST: () => ST, fam: fam, derive: derive, ORDER: ORDER, setPos: setPos, player: () => PLAYER, checkDef: checkDef, predDef: predDef, PRED_SET: PRED_SET, level: () => LEVEL, KEY: KEY, BREED: BREED, ROLL_ORDER: ROLL_ORDER, dice: () => diceMode, crossOf: crossOf, makeEgg: makeEgg };
})();
