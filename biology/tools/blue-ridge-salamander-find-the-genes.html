<script>
/* Blue Ridge Salamander Project genome engine. Draft v2 (genes on chromosomes), 2026-11-11.
   A Creature Code regenerates the same genome every time. No server, no student data.
   Every gene draws from its own seeded stream (code + gene id), so adding a gene later
   never changes a gene students already decoded. */
const BRS = (function () {
  'use strict';
  const VERSION = 'v2 draft 2026-11-11';
  const ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // 31 characters, no 0 O 1 I L

  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rng(seed) {
    let a = hashStr(seed);
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- Three sites, three populations. Every fact here has a source in the session record. ---------- */
  const SITES = [
    { id: 'TF', die: [1, 2], pop: 'Talus Firetail', place: 'Hawksbill', region: 'Shenandoah National Park · Page and Madison counties', elev: '4,050 ft', lat: 38.555, lon: -78.395,
      rocks: ['greenstone slab', 'greenstone block', 'mossy greenstone'],
      text: 'The rock is greenstone, basalt lava changed by heat and pressure, and on the steep sides it breaks into slopes of loose blocks called talus. Balsam fir grows at the summit, one of the few places in the park where it does. The real Shenandoah salamander lives on this mountain and two others, and nowhere else on Earth.',
      legend: '' },
    { id: 'CE', die: [3, 4], pop: 'Cinder Eft', place: 'James River water gap', region: 'Blue Ridge Parkway at Otter Creek', elev: '649 ft', lat: 37.555, lon: -79.367,
      rocks: ['flat river stone', 'river cobble', 'mossy boulder'],
      text: 'The James River cuts straight through the Blue Ridge here, and the bank is the lowest point on the whole Blue Ridge Parkway. Stone locks from the old James River and Kanawha Canal still stand beside the water. In the mountains to the south, the real Peaks of Otter salamander lives in old hardwood forest in three Virginia counties and nowhere outside the state.',
      legend: '' },
    { id: 'HE', die: [5, 6], pop: 'Highland Emberback', place: 'Mount Rogers', region: 'Grayson and Smyth counties', elev: '5,729 ft', lat: 36.66, lon: -81.545,
      rocks: ['rhyolite slab', 'rhyolite block', 'mossy rhyolite'],
      text: 'Mount Rogers is the highest point in Virginia. Its rock is rhyolite, left by volcanoes that erupted here long ago, and a dark forest of spruce and Fraser fir covers the top. In the rivers of this corner of the state lives the real eastern hellbender, a salamander more than two feet long that local people call the snot-otter and the devil dog.',
      legend: '' }
  ];
  const site = id => SITES.find(s => s.id === id);
  const siteForRoll = n => SITES.find(s => s.die.indexOf(n) >= 0);

  /* ---------- Creature Codes: two site letters + four characters + one check character ---------- */
  function checkChar(six) {
    let sum = 0;
    for (let i = 0; i < six.length; i++) sum += ALPHA.indexOf(six[i]) * (i + 1);
    return ALPHA[sum % 31];
  }
  function parseCode(raw) {
    const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.length !== 7) return { ok: false, why: 'A Creature Code is two site letters and five characters, like TF-7K3QM.' };
    const pre = s.slice(0, 2), body = s.slice(2);
    if (!site(pre)) return { ok: false, why: 'A Creature Code starts with TF, CE or HE, the letters of the site where it was found.' };
    for (const ch of body) if (ALPHA.indexOf(ch) < 0) return { ok: false, why: 'Codes never use 0, 1, I, L or O. Look at the slip again.' };
    if (checkChar(pre + body.slice(0, 4)) !== body[4]) return { ok: false, why: 'That code has a typo in it. Check each character against the slip.' };
    return { ok: true, code: pre + '-' + body, site: pre };
  }
  function codeFrom(rand, siteId) {
    let four = '';
    for (let i = 0; i < 4; i++) four += ALPHA[Math.floor(rand() * 31)];
    return siteId + '-' + four + checkChar(siteId + four);
  }
  function batch(word, n, siteId) {
    const r = rng('batch|' + String(word).trim().toLowerCase() + '|' + siteId);
    const out = [];
    while (out.length < n) { const c = codeFrom(r, siteId); if (out.indexOf(c) < 0) out.push(c); }
    return out;
  }

  /* ---------- The universal genetic code ---------- */
  const BASES = 'UCAG';
  const AA1 = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
  const THREE = { F: 'Phe', L: 'Leu', S: 'Ser', Y: 'Tyr', '*': 'STOP', C: 'Cys', W: 'Trp', P: 'Pro', H: 'His', Q: 'Gln', R: 'Arg', I: 'Ile', M: 'Met', T: 'Thr', N: 'Asn', K: 'Lys', V: 'Val', A: 'Ala', D: 'Asp', E: 'Glu', G: 'Gly' };
  const CODON = {}, SYN = {};
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) {
    const c = BASES[i] + BASES[j] + BASES[k], aa = THREE[AA1[i * 16 + j * 4 + k]];
    CODON[c] = aa; (SYN[aa] = SYN[aa] || []).push(c);
  }
  const AMINO = Object.keys(SYN).filter(a => a !== 'STOP').sort();
  const toRNA = { A: 'U', T: 'A', G: 'C', C: 'G' }, toDNA = { A: 'T', U: 'A', G: 'C', C: 'G' };
  const transcribe = dna => dna.split('').map(b => toRNA[b]).join('');
  const templateOf = rna => rna.split('').map(b => toDNA[b]).join('');
  function translate(codons) {
    const out = []; let stopped = false;
    for (const c of codons) {
      if (stopped) { out.push('none'); continue; }
      const aa = CODON[c]; out.push(aa); if (aa === 'STOP') stopped = true;
    }
    return out;
  }

  /* ---------- DRAFT trait list, genome format v2 ----------
     15 chromosome pairs: 1 to 14 plus the sex pair. Every gene sits on a chromosome; some chromosomes carry two genes and two carry none.
     A gene on the coding strand: TATAAA, a short spacer, ATG, seven more codons, a stop. pf = allele frequencies per population. */
  const GENES = [
    { id: 'STR', chr: '1', name: 'Back stripe', kind: 'complete dominance', real: 'modeled on the striped and lead-backed forms of the red-backed salamander',
      alleles: [{ s: 'S', label: 'striped', p: ['Ala', 'Cys', 'Pro', 'Leu', 'Gly', 'Asp', 'Ser'] }, { s: 's', label: 'lead-backed', p: ['Ala', 'Arg', 'Pro', 'Leu', 'Gly', 'Asp', 'Ser'] }], pf: { TF: [0.3, 0.7], CE: [0.6, 0.4], HE: [0.7, 0.3] } },
    { id: 'COL', chr: '2', name: 'Ember color', kind: 'incomplete dominance', real: 'real stripes run from red to yellow',
      alleles: [{ s: 'R', label: 'red', p: ['His', 'Val', 'Ser', 'Gly', 'Lys', 'Ala', 'Leu'] }, { s: 'Y', label: 'yellow', p: ['His', 'Val', 'Phe', 'Gly', 'Lys', 'Ala', 'Leu'] }], pf: { TF: [0.7, 0.3], CE: [0.3, 0.7], HE: [0.5, 0.5] } },
    { id: 'TOX', chr: '2', name: 'Skin toxin', kind: 'complete dominance', real: 'many salamanders secrete skin toxins',
      alleles: [{ s: 'T', label: 'toxin glands', p: ['Lys', 'Asp', 'Thr', 'Ile', 'Gly', 'Ala', 'Phe'] }, { s: 't', label: 'no toxin', p: ['Lys', 'Asn', 'Thr', 'Ile', 'Gly', 'Ala', 'Phe'] }], pf: { TF: [0.6, 0.4], CE: [0.4, 0.6], HE: [0.5, 0.5] } },
    { id: 'SPT', chr: '3', name: 'Flecks and spots', kind: 'codominance', real: 'brass flecks occur on real woodland salamanders of the Blue Ridge',
      alleles: [{ s: 'B', label: 'brass flecks', p: ['Glu', 'Leu', 'Gln', 'Ser', 'Val', 'Thr', 'Asp'] }, { s: 'W', label: 'white spots', p: ['Glu', 'Pro', 'Gln', 'Ser', 'Val', 'Thr', 'Asp'] }], pf: { TF: [0.7, 0.3], CE: [0.3, 0.7], HE: [0.5, 0.5] } },
    { id: 'GLO', chr: '4', name: 'Glow', kind: 'multiple alleles', real: 'fantasy trait',
      alleles: [{ s: 'E', label: 'ember glow', p: ['Phe', 'Thr', 'Trp', 'Val', 'Asn', 'Gly', 'Pro'] }, { s: 'F', label: 'foxfire glow', p: ['Phe', 'Thr', 'Cys', 'Val', 'Asn', 'Gly', 'Pro'] }, { s: 'n', label: 'no glow', p: ['Phe', 'Thr', 'Arg', 'Val', 'Asn', 'Gly', 'Pro'] }], pf: { TF: [0.45, 0.15, 0.4], CE: [0.15, 0.5, 0.35], HE: [0.3, 0.3, 0.4] } },
    { id: 'CLW', chr: '4', name: 'Claws', kind: 'complete dominance', real: 'fantasy trait: real salamanders have no claws',
      alleles: [{ s: 'C', label: 'clawed', p: ['Ser', 'Tyr', 'Asp', 'Ala', 'Leu', 'Lys', 'Thr'] }, { s: 'c', label: 'no claws', p: ['Ser', 'His', 'Asp', 'Ala', 'Leu', 'Lys', 'Thr'] }], pf: { TF: [0.6, 0.4], CE: [0.3, 0.7], HE: [0.5, 0.5] } },
    { id: 'GIL', chr: '5', name: 'Gills', kind: 'complete dominance', real: 'some salamanders keep larval gills as adults',
      alleles: [{ s: 'G', label: 'gills lost', p: ['Asn', 'Ile', 'Glu', 'Lys', 'Val', 'Ser', 'Arg'] }, { s: 'g', label: 'gills kept', p: ['Asn', 'Ile', 'Gly', 'Lys', 'Val', 'Ser', 'Arg'] }], pf: { TF: [0.9, 0.1], CE: [0.35, 0.65], HE: [0.7, 0.3] } },

    let h = '<section class="chrom' + (done ? ' done' : '') + '" id="ch-' + ch.key + '"><div class="chead"><h3>' + ch.label + (done ? ' <span class="tick">✓ ' + (ch.genes.length ? ch.genes.length + (ch.genes.length === 1 ? ' gene' : ' genes') : 'no gene') + '</span>' : '') + '</h3><span class="small muted">' + ch.seq.length + ' bases · 5′ → 3′</span></div>';
    const two = !!S.other[ch.key];
    h += dna(ch, ms, { live: !done, codons: done, two: two });
    h += '<div class="row"><button class="quiet" data-act="other" data-k="' + ch.key + '" aria-pressed="' + two + '">' + (two ? 'Hide the other strand' : 'Show the other strand') + '</button>' + (two ? '<span class="small muted">DNA has two strands. The lower one pairs with the upper one, letter for letter, and runs the opposite way.</span>' : '') + '</div>';
    if (done) h += ch.genes.length ? '<p class="small muted">Each gene is split into threes from its start: ' + ch.genes.map(() => '9 codons').join(' and ') + '.</p>' : '<p class="small muted">An ATG with no TATA box in front of it does not start a gene.</p>';
    else {
      h += '<div class="row"><button data-act="check" data-k="' + ch.key + '">Check this chromosome</button><button class="quiet" data-act="none" data-k="' + ch.key + '" aria-pressed="' + !!S.none[ch.key] + '">' + (S.none[ch.key] ? '☑' : '☐') + ' No gene here</button><button class="quiet" data-act="clear" data-k="' + ch.key + '">Clear marks</button></div>';
      if (fb[ch.key]) h += '<ul class="hints" role="status">' + fb[ch.key].map(x => '<li>' + x + '</li>').join('') + '</ul>';
    }
    return h + '</section>';
  }
  function pensHTML() {
    return '<div class="pens" role="group" aria-label="Highlighters">' + PENS.map(p => '<button class="pen pen-' + p[0] + '" data-act="pen" data-p="' + p[0] + '" aria-pressed="' + (S.pen === p[0]) + '"><i></i>' + p[1] + '</button>').join('') + '</div>';
  }
  function sexHTML() {
    const ready = S.ok.sA && S.ok.sB;
    if (!ready) return '';
    if (S.sexOk) return '<section class="block"><h3>Pair 15 decides the sex</h3><p class="say good"><b>' + (CR.sex === 'XX' ? 'XX, female.' : 'XY, male.') + '</b> ' + (CR.sex === 'XX' ? 'Both copies are X chromosomes: the same two genes sit in the same places on each.' : 'The first copy is an X with two genes. The second is a Y: shorter, with no gene on it.') + '</p></section>';
    return '<section class="block"><h3>Pair 15 decides the sex</h3><fieldset id="sexq"><legend>Compare the two copies of chromosome 15. What is this salamander?</legend><label class="opt"><input type="radio" name="sex" id="sex-XX" value="XX"' + (S.sex === 'XX' ? ' checked' : '') + '><span><b>XX, female.</b> Two copies about the same length, with the same genes.</span></label><label class="opt"><input type="radio" name="sex" id="sex-XY" value="XY"' + (S.sex === 'XY' ? ' checked' : '') + '><span><b>XY, male.</b> The second copy is shorter and carries no gene.</span></label></fieldset><div class="row"><button data-act="sex">Check</button></div>' + (fb.sex ? '<p class="say warn" role="status">' + fb.sex + '</p>' : '') + '</section>';
  }
  function findView() {
    const tot = totalGenes(), fd = foundGenes();
    let h = '<section class="block"><span class="eyebrow">Before decoding · find the genes</span><h2>Most of this DNA is not a gene. Mark the parts that are.</h2>' +
      '<p class="lede">These are all 15 chromosomes of ' + S.code + ', one strand of each, read left to right. Somewhere in them are the genes that build this salamander.</p>' +
      '<ol class="rule"><li><b class="k r">TATA</b> A gene is switched on at a TATA box. Find every one.</li><li><b class="k g">ATG</b> The gene starts at the first ATG after the TATA box.</li><li><b class="k p">Stop</b> Count by threes from the start. The first TAA, TAG or TGA that lands on a count of three ends the gene.</li><li><b class="k t">Gene</b> Everything from the start through the stop is the gene.</li></ol>' +
      '<p><b>To highlight:</b> pick a pen, tap the first letter, then tap the last letter.</p><p class="basekey" aria-label="Base colors"><span>Under every letter:</span><span><i style="background:var(--bA)"></i>A</span><span><i style="background:var(--bC)"></i>C</span><span><i style="background:var(--bG)"></i>G</span><span><i style="background:var(--bT)"></i>T</span><span>In RNA, U takes T’s color on a round tile.</span></p>' +
      (S.example ? '<p class="say">This is an example salamander. Type your own Creature Code to load yours.</p>' : '') +
      '<form class="row" data-form="code"><div class="field"><label for="code">Creature Code</label><input type="text" id="code" maxlength="10" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="TF-7K3QM" value="' + (S.example ? '' : esc(S.code)) + '"></div><button class="ghost" style="align-self:flex-end">Load</button></form>' + (codeMsg ? '<p class="say warn">' + codeMsg + '</p>' : '') + '</section>';
    h += '<div class="sticky">' + pensHTML() + '<p class="progress" id="prog">' + progressText() + '</p></div>';
    h += CR.chroms.map(chromHTML).join('') + '<div id="sexbox">' + sexHTML() + '</div>';
    h += '<section class="block"><h3>Keep your genome</h3><p>Your highlighted genome page is the record of this animal’s DNA. Save it and upload it to Canvas.</p><div class="row"><a class="btn" href="#genome">Open my genome page</a></div></section>';
    void tot; void fd;
    return h;
  }
  function progressText() { const ck = CR.chroms.filter(c => S.ok[c.key]).length; return allDone() ? 'Every gene found. ' + totalGenes() + ' genes on 15 chromosome pairs.' : 'Genes found: ' + foundGenes() + ' of ' + totalGenes() + ' · chromosomes checked: ' + ck + ' of ' + CR.chroms.length; }
  function genomeView(teacher) {
    let h = '<section class="block"><span class="eyebrow">' + (teacher ? 'Teacher key · not for students' : 'My genome page') + '</span><h2>' + (teacher ? 'Key for ' + S.code : 'The genome of ' + (S.name ? esc(S.name) + ', ' : '') + S.code) + '</h2>';
    if (!teacher) h += '<div class="field"><label for="sname">Salamander’s name</label><input type="text" id="sname" maxlength="24" autocomplete="off" value="' + esc(S.name) + '" style="max-width:22rem"></div><p>' + (allDone() ? 'Every gene is found and checked.' : progressText() + '. The page can be saved at any point.') + '</p><div class="row"><button data-act="png" id="pngbtn"' + (downloads ? '' : ' hidden') + '>Save as an image</button><a class="btn ghost" href="#find">Back to highlighting</a></div><p class="small muted" id="savemsg" aria-live="polite">' + (saveMsg || (downloads ? 'The image holds every chromosome with your highlights. Upload it to the Canvas assignment.' : 'To keep this page, take a screenshot, then upload the screenshot to the Canvas assignment.')) + '</p>';
    else h += '<p>' + (CR.sex === 'XX' ? 'Female, XX.' : 'Male, XY.') + ' ' + totalGenes() + ' genes. Chromosomes 13 and 14 carry no gene.</p><div class="row"><a class="btn ghost" href="#find">Back</a></div>';
    h += '<div class="legend">' + PENS.slice(0, 4).map(p => '<span class="pen pen-' + p[0] + '"><i></i>' + p[1] + '</span>').join('') + '</div></section><section class="block">';
    CR.chroms.forEach(function (ch) { h += '<div class="gline"><div class="chead"><b>' + ch.label + '</b><span class="small muted">' + (teacher ? ch.name + ' · ' + (ch.genes.map(g => g.id).join(', ') || 'no gene') : (S.ok[ch.key] ? '✓ checked' : 'not checked yet')) + '</span></div>' + dna(ch, teacher ? keyMarks(ch) : (S.marks[ch.key] || []), { small: true, codons: teacher || !!S.ok[ch.key] }) + '</div>'; });
    return h + '</section>';
  }

  /* ---------- checking ---------- */
  function checkChrom(ch) {
    const ms = S.marks[ch.key] || [], by = { r: [], g: [], p: [], t: [] }, hints = [];
    ms.forEach(m => by[m.pen].push(m));
    const same = (m, a, b) => m.a === a && m.b === b, txt = m => ch.seq.substr(m.a, m.b - m.a + 1), n = ch.genes.length;
    if (!n) {
      if (S.none[ch.key] && !ms.length) return { ok: true };
      if (S.none[ch.key]) return { ok: false, hints: ['Erase the marks on this chromosome, then check again.'] };
      if (!ms.length) return { ok: false, hints: ['Nothing is marked yet. If there is no TATA box here, tap “No gene here.”'] };
      return { ok: false, hints: [by.g.some(m => txt(m) === 'ATG') ? 'That ATG has no TATA box in front of it, so it does not start a gene.' : 'Look for a TATA box first. With no TATA box there is no gene.'] };
    }
    if (S.none[ch.key]) return { ok: false, hints: ['There is a TATA box on this chromosome. Turn off “No gene here” and look again.'] };
    const rF = ch.genes.filter(g => by.r.some(m => same(m, g.tata, g.tata + 3) || same(m, g.tata, g.tata + 5))).length;
    if (rF < n || by.r.length > rF) hints.push(!by.r.length ? 'Start with the red pen: find every TATA.' : rF === n ? 'One red mark is not on a TATA box.' : 'Red: ' + rF + ' of ' + n + ' TATA boxes marked. Cover the letters T-A-T-A exactly.');
    const gF = ch.genes.filter(g => by.g.some(m => same(m, g.start, g.start + 2))).length, gBad = by.g.find(m => !ch.genes.some(g => same(m, g.start, g.start + 2)));
    if (gF < n || gBad) hints.push(!by.g.length ? 'Green: mark the start, the first ATG after each TATA box.' : gBad && txt(gBad) !== 'ATG' ? 'Green goes on exactly three letters: A-T-G.' : gBad ? 'A green mark is on an ATG that is not the first one after a TATA box.' : 'Green: ' + gF + ' of ' + n + ' starts marked.');
    const pF = ch.genes.filter(g => by.p.some(m => same(m, g.stop, g.stop + 2))).length, pBad = by.p.find(m => !ch.genes.some(g => same(m, g.stop, g.stop + 2)));
    if (pF < n || pBad) {
      let msg = 'Purple: ' + pF + ' of ' + n + ' stops marked.';
      if (!by.p.length) msg = 'Purple: count by threes from each start to the first stop.';
      else if (pBad && ['TAA', 'TAG', 'TGA'].indexOf(txt(pBad)) < 0) msg = 'A stop is TAA, TAG or TGA. Purple covers all three letters.';
      else if (pBad) { const g = ch.genes.filter(x => x.start < pBad.a).pop(); msg = !g ? 'A purple mark sits before any gene starts.' : (pBad.a - g.start) % 3 ? 'That stop is out of frame. Count by threes from the green start: 1-2-3, 1-2-3.' : 'That stop is past the end of the gene. The first stop in frame ends it.'; }
      hints.push(msg);
    }
    const tF = ch.genes.filter(g => by.t.some(m => same(m, g.start, g.end) || same(m, g.start + 3, g.stop - 1))).length;
    if (tF < n || by.t.length > tF) hints.push(!by.t.length ? 'Turquoise: cover the whole gene, from the start through the stop.' : 'Turquoise should run from the first letter of the start through the last letter of the stop.');
    return { ok: !hints.length, hints: hints.slice(0, 3) };
  }

  /* ---------- export ---------- */
  function exportBlob(done) {
    const PER = 50, CW = 22, CH = 30, M = 40, W = M * 2 + PER * CW + 9 * 6;
    let rows = 0; CR.chroms.forEach(c => { rows += Math.ceil(c.seq.length / PER); });
    const H = 150 + CR.chroms.length * 44 + rows * (CH + 4) + M, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H); g.fillStyle = '#1d2925'; g.textBaseline = 'alphabetic';
    g.font = '700 30px Helvetica, Arial, sans-serif'; g.fillText('Blue Ridge Salamander Project · genome of ' + S.code, M, 52);
    g.font = '18px Helvetica, Arial, sans-serif'; g.fillText((S.name ? 'Name: ' + S.name + '   ' : '') + progressText(), M, 82);
    let lx = M; PENS.slice(0, 4).forEach(function (p) { g.fillStyle = PENHEX[p[0]]; g.fillRect(lx, 100, 26, 20); g.fillStyle = '#1d2925'; g.font = '16px Helvetica, Arial, sans-serif'; g.fillText(p[1], lx + 34, 116); lx += 60 + g.measureText(p[1]).width; });
    let y = 150;
    CR.chroms.forEach(function (ch) {
      const ms = S.marks[ch.key] || [], cls = new Array(ch.seq.length).fill('');
      ms.forEach(m => { for (let i = m.a; i <= m.b; i++) cls[i] += m.pen; });
      g.fillStyle = '#1d2925'; g.font = '700 17px Helvetica, Arial, sans-serif'; g.fillText(ch.label + (S.ok[ch.key] ? '  ✓' : ''), M, y + 20);
      g.font = '14px Helvetica, Arial, sans-serif'; g.fillStyle = '#55655d'; g.fillText(ch.seq.length + ' bases, 5′ → 3′', M + 300, y + 20); y += 30;
      for (let i = 0; i < ch.seq.length; i++) {
        const col = i % PER, row = Math.floor(i / PER), x = M + col * CW + Math.floor(col / 10) * 6, yy = y + row * (CH + 4), c = cls[i];
        const top = c.indexOf('r') >= 0 ? 'r' : c.indexOf('g') >= 0 ? 'g' : c.indexOf('p') >= 0 ? 'p' : c.indexOf('t') >= 0 ? 't' : '';
        const nx = (col % 10 === 9 && col < PER - 1 && i + 1 < ch.seq.length) ? cls[i + 1] : null, bridge = nx !== null && top && (nx.indexOf(top) >= 0) ? 6 : 0, tb = nx !== null && c.indexOf('t') >= 0 && nx.indexOf('t') >= 0 ? 6 : 0;
        if (top) { g.fillStyle = PENHEX[top]; g.fillRect(x, yy, CW + bridge, CH); if (top !== 't' && c.indexOf('t') >= 0) { g.fillStyle = PENHEX.t; g.fillRect(x, yy, CW + tb, 5); } }
        g.fillStyle = BASEHEX[ch.seq[i]]; g.fillRect(x + 2, yy + CH - 4, CW - 4, 4);
        g.fillStyle = top && top !== 't' ? '#ffffff' : '#1d2925'; g.font = '600 18px "IBM Plex Mono", Menlo, Consolas, monospace'; g.textAlign = 'center'; g.fillText(ch.seq[i], x + CW / 2, yy + 21); g.textAlign = 'left';
      }
      y += Math.ceil(ch.seq.length / PER) * (CH + 4) + 14;
    });
    g.fillStyle = '#55655d'; g.font = '13px Helvetica, Arial, sans-serif'; g.fillText('© J. R. Schwebach. All rights reserved.', M, H - 14);
    cv.toBlob(done, 'image/png');
  }

  /* ---------- render and events ---------- */
  function render() { const v = view(); app.innerHTML = v === 'genome' ? genomeView(false) : v === 'teacher' ? genomeView(true) : findView(); }
  function repaint(key) { const el = $('#ch-' + key), ch = CR.chroms.find(c => c.key === key); if (el && ch) el.outerHTML = chromHTML(ch); const p = $('#prog'); if (p) p.textContent = progressText(); const sb = $('#sexbox'); if (sb) sb.innerHTML = sexHTML(); }
  app.addEventListener('click', function (ev) {
    const base = ev.target.closest('.dna[data-k] .b');
    if (base) {
      const key = base.parentNode.dataset.k, i = +base.dataset.i; S.marks[key] = S.marks[key] || []; fb[key] = null;
      if (S.pen === 'x') { S.marks[key] = S.marks[key].filter(m => i < m.a || i > m.b); anchor = null; }
      else if (anchor && anchor.key === key && anchor.pen === S.pen) { S.marks[key].push({ pen: S.pen, a: Math.min(anchor.i, i), b: Math.max(anchor.i, i) }); anchor = null; }
      else anchor = { key: key, i: i, pen: S.pen };
      save(); repaint(key); return;
    }
    const t = ev.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act, key = t.dataset.k;
    if (a === 'pen') { S.pen = t.dataset.p; anchor = null; save(); const old = anchor; void old; document.querySelectorAll('.pen[data-p]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === S.pen))); document.querySelectorAll('.b.anchor').forEach(b => b.classList.remove('anchor')); }
    else if (a === 'other') { S.other[key] = !S.other[key]; save(); repaint(key); }
    else if (a === 'clear') { S.marks[key] = []; fb[key] = null; anchor = null; save(); repaint(key); }
    else if (a === 'none') { S.none[key] = !S.none[key]; fb[key] = null; save(); repaint(key); }
    else if (a === 'check') { const ch = CR.chroms.find(c => c.key === key), r = checkChrom(ch); anchor = null; if (r.ok) { S.ok[key] = true; fb[key] = null; } else fb[key] = r.hints; save(); repaint(key); }
    else if (a === 'sex') { if (S.sex === CR.sex) { S.sexOk = true; fb.sex = null; } else fb.sex = S.sex ? 'Look again at the second copy of chromosome 15: how long is it, and how many genes did you find on it?' : 'Choose one first.'; save(); const sb = $('#sexbox'); sb.innerHTML = sexHTML(); $('#prog').textContent = progressText(); }
    else if (a === 'png') {
      const msg = $('#savemsg'); msg.textContent = 'Building the image…';
      exportBlob(function (blob) { if (!blob || !downloads) { msg.textContent = 'The image could not be made here. Take a screenshot instead.'; return; } downloads.save({ filename: S.code + '-genome.png', data: blob }).then(function () { msg.textContent = 'Saved. Upload that image to the Canvas assignment.'; }, function (e) { msg.textContent = e && e.code === 'declined' ? 'Not saved. Press the button again when ready.' : 'Saving is not available here. Take a screenshot instead.'; }); });
    }
  });
  app.addEventListener('change', function (ev) { const t = ev.target; if (t.name === 'sex') { S.sex = t.value; save(); } });
  app.addEventListener('input', function (ev) { const t = ev.target; if (t.id === 'sname') { S.name = t.value.slice(0, 24); save(); } });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const p = BRS.parseCode($('#code').value);
    if (!p.ok) { codeMsg = p.why; render(); return; }
    codeMsg = ''; if (p.code !== S.code) { S = fresh(p.code); CR = BRS.creature(p.code); fb = {}; anchor = null; save(); }
    render();
  });
  window.addEventListener('hashchange', function () { anchor = null; render(); window.scrollTo(0, 0); });
  render();
  if (!(window.claude && window.claude.use)) { downloads = { save: function (o) { return new Promise(function (res) { const u = URL.createObjectURL(o.data), a = document.createElement('a'); a.href = u; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 6000); res(); }); } }; const b0 = $('#pngbtn'); if (b0) b0.hidden = false; }
  if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { downloads = d; const b = $('#pngbtn'); if (d && b) { b.hidden = false; const m = $('#savemsg'); if (m) m.textContent = 'The image holds every chromosome with your highlights. Upload it to the Canvas assignment.'; } }, function () { /* no saving here */ });
  window.__BRS_FIND = { exportBlob: exportBlob };
})();

</script>
