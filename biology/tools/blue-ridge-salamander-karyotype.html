<script>
/* Blue Ridge Salamander Project genome engine. v3 (two alleles, one spelling per allele), built 2026-11-11.
   FROZEN for edition 2026-27 at genome mark D3Y-KTT (Reid's decision, 2026-11-15). This school year, do not change genes,
   alleles, sites, odds, seeds or stamps: every student's Creature Code, stamps and keeper code depend on them. Wording
   and comments may change. After any edit, fingerprint() must still return D3Y-KTT and TF-7CBW4 must still give
   final stamp AT7-15M and keeper code TF-7CBW4-AT7. Any rebuild waits for the end of the project.
   A Creature Code regenerates the same genome every time. No server, no student data.
   Every gene draws from its own seeded stream (code + gene id), so adding a gene later
   never changes a gene students already decoded.

   What changed from v2 (decisions of 11/11, 1:04 to 1:40 pm):
   - One DNA spelling per allele for the whole ridge. Any two alleles of a gene differ at exactly one base.
   - Within one animal, the father's copy of a chromosome uses the mother's copy's filler DNA and gene
     positions, and differs only at the allele letters. Filler and positions stay unique to each animal.
   - The drawn set is the mother's: chromosomes 1 to 14 and the X she gave (15 strips). Males get a 16th
     strip, the Y from the father. A female's second X is a partner, not a strip.
   - Power gene (four codominant alleles) in place of Breath.
   - The stamp carries the edition and which genes are done. Keeper code = Creature Code + first three
     characters of the final stamp. */
const BRS = (function () {
  'use strict';
  const VERSION = 'v3 frozen 2026-11-15';
  const EDITION = { id: '2026-27', mark: 'A', label: 'Edition 2026-27' };
  const EDITIONS = { A: EDITION };
  /* Both rules were settled with Reid on 11/11 (decisions log). They stay switches so the checks can run each way. */
  const DEFAULTS = {
    emberOnMotherCopy: true, // a new mutation sits on the mother's copy of chromosome 9; the father's copy is the ridge reference
    toxinGraded: true        // TT strong toxin, Tt mild, tt none (decided 2:17 pm)
  };
  const MUTATION_ODDS = 0.5; // a second die roll at the rock: 1 to 3 means the animal carries a new mutation (decided 2:13 pm)
  const ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // 31 characters, no 0 O 1 I L

  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rng(seed) {
    let a = hashStr(seed);
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- Three sites, three populations. Every fact here has a source in the session record. ---------- */
  const SITES = [
    { id: 'TF', die: [1, 2], pop: 'Talus Firetail', place: 'Hawksbill', region: 'Shenandoah National Park · Page and Madison counties', elev: '4,050 ft', lat: 38.555, lon: -78.395,
      rocks: ['greenstone slab', 'greenstone block', 'mossy greenstone'],
      text: 'The rock is greenstone, basalt lava changed by heat and pressure, and on the steep sides it breaks into slopes of loose blocks called talus. Balsam fir grows at the summit, one of the few places in the park where it does. The real Shenandoah salamander lives on this mountain and two others, and nowhere else on Earth.',
      legend: '' },
    { id: 'CE', die: [3, 4], pop: 'Cinder Eft', place: 'James River water gap', region: 'Blue Ridge Parkway at Otter Creek', elev: '649 ft', lat: 37.555, lon: -79.367,
      rocks: ['flat river stone', 'river cobble', 'mossy boulder'],
      text: 'The James River cuts straight through the Blue Ridge here, and the bank is the lowest point on the whole Blue Ridge Parkway. Stone locks from the old James River and Kanawha Canal still stand beside the water. In the mountains to the south, the real Peaks of Otter salamander lives in old hardwood forest in three Virginia counties and nowhere outside the state.',
      legend: '' },
    { id: 'HE', die: [5, 6], pop: 'Highland Emberback', place: 'Mount Rogers', region: 'Grayson and Smyth counties', elev: '5,729 ft', lat: 36.66, lon: -81.545,
      rocks: ['rhyolite slab', 'rhyolite block', 'mossy rhyolite'],
      text: 'Mount Rogers is the highest point in Virginia. Its rock is rhyolite, left by volcanoes that erupted here long ago, and a dark forest of spruce and Fraser fir covers the top. In the rivers of this corner of the state lives the real eastern hellbender, a salamander more than two feet long that local people call the snot-otter and the devil dog.',
      legend: '' }
  ];
  const site = id => SITES.find(s => s.id === id);
  const siteForRoll = n => SITES.find(s => s.die.indexOf(n) >= 0);

  /* ---------- Creature Codes: two site letters + four characters + one check character ---------- */
  function checkChar(six) {
    let sum = 0;
    for (let i = 0; i < six.length; i++) sum += ALPHA.indexOf(six[i]) * (i + 1);
    return ALPHA[sum % 31];
  }
  function parseCode(raw) {
    const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.length !== 7) return { ok: false, why: 'A Creature Code is two site letters and five characters, like TF-7K3QM.' };
    const pre = s.slice(0, 2), body = s.slice(2);
    if (!site(pre)) return { ok: false, why: 'A Creature Code starts with TF, CE or HE, the letters of the site where it was found.' };
    for (const ch of body) if (ALPHA.indexOf(ch) < 0) return { ok: false, why: 'Codes never use 0, 1, I, L or O. Look at the slip again.' };
    if (checkChar(pre + body.slice(0, 4)) !== body[4]) return { ok: false, why: 'That code has a typo in it. Check each character against the slip.' };
    return { ok: true, code: pre + '-' + body, site: pre };
  }
  function codeFrom(rand, siteId) {
    let four = '';
    for (let i = 0; i < 4; i++) four += ALPHA[Math.floor(rand() * 31)];
    return siteId + '-' + four + checkChar(siteId + four);
  }
  /* The second die roll. 1 to 3: the animal carries a new mutation. 4 to 6: it does not.
     The page draws codes until the animal behind one matches the roll, so the code alone still rebuilds the animal. */
  const mutationForRoll = n => n >= 1 && n <= 3;
  function codeForRolls(rand, siteRoll, mutationRoll) {
    const s = siteForRoll(siteRoll); if (!s || !(mutationRoll >= 1 && mutationRoll <= 6)) return null;

    let h = '<section class="block check" id="check"><span class="tag">Karyotype check</span><div class="parts">', open = true;
    P.forEach(function (def, j) {
      if (!open) return;

    if (P.every(p => partDone(c[p.id]))) {

  }

  /* ---------- one pair, close up: tapped on the card ---------- */
  function copyWord(kc, sexKnown) {
    const she = kc.from === 'mother', own = c => 'the copy the ' + (she ? 'mother' : 'father') + ' got from ' + (she ? 'her' : 'his') + ' own ' + (c ? 'father' : 'mother');
    if (kc.chr === 'Y') return sexKnown ? 'his Y, which the father got from his own father' : own(1);

  }
  function pairHtml() {
    if (!SEL) return '<p class="say muted" id="pairhint">Tap a chromosome on the card to see its genes.</p>';
    const b = OPEN.baby, K = OPEN.K, i = SEL.i, p = K.pairs[i], chk = checkState(), sexPair = i === 14, sexKnown = !sexPair || chk.sexShown;
    const title = !sexPair ? 'Chromosome ' + (i + 1) : chk.sexShown ? 'The sex pair: ' + (b.sex === 'XX' ? 'X and X' : 'X and Y') : chk.pairShown ? 'The sex pair' : 'The last pair';
    let h = '<section class="block" id="pairbox"><h3>' + title + ' <span class="muted small">pair ' + (i + 1) + ' of 15</span></h3><div class="pairgrid"><div class="mini" id="mini"></div><div class="origin">';
    p.chromosomes.forEach(function (kc, k) {
      const hue = k ? 'dad' : 'mom', lead = '<b>' + (k ? 'Blue, from the sperm' : 'Orange, from the egg') + '</b>';
      if (kc.cross && chk.showMixed) {
        h += '<span>' + swatch(hue, kc.parentCopy === 1) + swatch(hue, kc.cross.tipCopy === 1) + '<span>' + lead + ': a mixed strand. Down to the yellow trade point it is ' + copyWord(kc, sexKnown) + '. Past the trade point it is ' + copyWord({ from: kc.from, chr: kc.chr === 'Y' ? 'Y' : 'n', parentCopy: kc.cross.tipCopy }, true) + '.</span></span>';
      } else if (kc.cross) {
        h += '<span>' + swatch(hue, kc.parentCopy === 1) + '<span>' + lead + '.</span></span>';
      } else {
        h += '<span>' + swatch(hue, kc.parentCopy === 1) + '<span>' + lead + ': ' + copyWord(kc, sexKnown) + (sexPair && !sexKnown ? '' : kc.parentCopy === 1 ? ' (banded)' : ' (solid)') + '.</span></span>';
      }
    });
    h += '</div></div>';
    const genes = p.chromosomes[0].loci;
    if (!genes.length) h += '<p class="say">None of the sixteen genes we follow is on this chromosome. It still has a partner, and it still came one from each parent.</p>';
    else {
      h += '<div class="scroll"><table class="tbl"><thead><tr><th>Gene</th><th>From the mother (egg)</th><th>From the father (sperm)</th><th>Genotype</th><th>It shows</th></tr></thead><tbody>';
      genes.forEach(function (lo) {
        const fa = p.chromosomes[1].loci.find(x => x.gene === lo.gene), gid = lo.gene;
        const cell = x => gid === 'EMB' ? (x.allele === 'changed' ? '<span class="a">' + (x.broken ? 'e*' : 'e') + '</span> ' + esc(x.label) : esc(x.label)) : '<span class="a">' + esc(x.allele) + '</span> ' + esc(x.label) + (x.isNew ? ' <span class="ok">(new)</span>' : '');
        let geno, shows;
        if (gid === 'EMB') { geno = b.albino ? 'two broken copies' : b.carrier ? 'one broken copy' : ''; shows = b.albino ? 'albino: pale body, pink eyes, no ember color' : b.carrier ? 'ember color shows; a carrier' : 'ember color shows'; }
        else { geno = F.entry(b, gid).genotype; shows = F.traitWord(b, gid); }
        h += '<tr' + (lo.isNew || (fa && fa.isNew) ? ' class="hi"' : '') + '><td>' + SHORT[gid] + '</td><td class="m">' + cell(lo) + '</td><td class="d">' + (fa ? cell(fa) : (sexKnown ? 'none: the Y carries no copy' : 'none on this chromosome')) + '</td><td class="a">' + esc(geno) + '</td><td>' + esc(shows) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    b.newPower.forEach(function (n) { if (i === 6) h += '<p class="note">New power: <b>' + esc(n.toLabel) + '</b>. In the ' + n.in + ', codon ' + n.codonNumber + ' of the power gene changed from <span class="a">' + n.oldCodon + '</span> to <span class="a">' + n.newCodon + '</span>, so ' + esc(AA[n.oldAA] || n.oldAA) + ' became ' + esc(AA[n.newAA] || n.newAA) + '. The ring on the card marks it.</p>'; });
    const cp = F.CROSS.find(x => x.i === i);
    if (cp) {
      h += '<p class="note">' + esc(cp.name) + ' sit on the same chromosome, so they are linked. They pass into an egg or a sperm together unless crossing over trades the piece between them.' +
        (LEVEL === 'de' ? ' They are ' + cp.mapUnits + ' map units apart: about ' + cp.mapUnits + '% of eggs or sperm carry a mixed strand between them.' : '') +
        (sexPair && chk.sexShown ? (b.sex === 'XX' ? ' A father has one X, and every daughter gets it.' : ' A son has one X, from his mother, so he has one copy of each of these two genes.') : '') + '</p>';
      if (chk.showMixed) b.crossings.filter(x => x.pair === i).forEach(function (x) { h += '<p class="note">Crossing over: the ' + x.in + '’s ' + (x.chr === 'X' ? 'X' : 'chromosome ' + x.chr) + ' is a mixed strand. It carries ' + SHORT[x.near].toLowerCase() + ' <span class="a">' + esc(x.nearAllele) + '</span> from ' + esc(x.nearFrom) + ' and ' + SHORT[x.far].toLowerCase() + ' <span class="a">' + esc(x.farAllele) + '</span> from ' + esc(x.farFrom) + '.' + (x.changes ? '' : ' Both copies carried ' + esc(x.farAllele) + ' there, so this trade changed nothing you can see.') + '</p>'; });

  }
  function miniDraw() {

        const t = el('text', { x: p.chromosomes[1].loci.length ? 150 : 150, y: y + 4 }, nameL); t.textContent = SHORT[lo.gene].toLowerCase();
      });
    });
    const foot = el('g', { 'font-family': 'IBM Plex Mono, monospace', 'font-size': 11, 'text-anchor': 'middle', 'font-weight': 600 }, svg);
    el('text', { x: X[0], y: 234, fill: HUE.mom.ink }, foot).textContent = 'from the egg';
    el('text', { x: X[1], y: 234, fill: HUE.dad.ink }, foot).textContent = 'from the sperm';
  }

  /* ---------- screens ---------- */
  function chips() {
    const c = $('#chips'), s = $('#sibs');

    c.innerHTML = '<span class="chip mom">♀ ' + esc(OPEN.M.code) + '</span><span class="chip dad">♂ ' + esc(OPEN.D.code) + '</span>';
    s.innerHTML = OPEN.sibs.map(x => '<button type="button" class="chip' + (x.egg === OPEN.egg ? ' now' : '') + '" data-act="sib" data-egg="' + x.egg + '"' + (x.egg === OPEN.egg ? ' aria-current="true"' : '') + '>' + (x.n ? 'Egg ' + x.n + ' · ' : 'Egg · ') + x.egg + '</button>').join('');
  }
  const sibIndex = () => OPEN.sibs.findIndex(x => x.egg === OPEN.egg);
  function openScreen() {
    const fams = storedFamilies();
    let h = '<section class="block"><h2>Open a hatchling’s card</h2><p class="lede">A karyotype is a picture of every chromosome in one cell, sorted into pairs. To open a hatchling’s card, type its three codes from the Family Field Sheet.</p>' +
      '<div class="who"><div class="field"><label for="km">The mother’s keeper code</label><input id="km" class="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="TF-H5UHE-AMN" value="' + esc(IN.m) + '"></div>' +
      '<div class="field"><label for="kf">The father’s keeper code</label><input id="kf" class="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="TF-7CBW4-AT7" value="' + esc(IN.f) + '"></div>' +
      '<div class="field"><label for="ke">The egg code</label><input id="ke" class="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXX-XXX-XXX" value="' + esc(IN.egg) + '"></div></div>' +
      '<div class="btnrow"><button type="button" data-act="opencodes">Open the card</button>' + (PROJ || TEACHER ? '<button type="button" class="ghost" data-act="demo">Teach with the Test Salamander family</button><button type="button" class="ghost" data-act="breed">Open the Breeding Program pair’s egg 1</button>' : '') + '</div>' +
      '<p class="fb" id="ms">' + (MSG ? '<span class="bad">' + esc(MSG) + '</span>' : '') + '</p></section>';
    if (fams.length) {
      h += '<section class="block"><h3>Hatchlings on this iPad</h3>';
      fams.forEach(function (fm) {
        h += '<p class="small"><b>' + esc(F.animal(fm.m).code) + '</b> and <b>' + esc(F.animal(fm.f).code) + '</b></p><div class="btnrow">' + fm.eggs.map(x => '<button type="button" class="ghost small" data-act="openegg" data-m="' + fm.m + '" data-f="' + fm.f + '" data-egg="' + x.egg + '">Egg ' + x.n + ' · ' + x.egg + '</button>').join('') + '</div>';

  }
  const NOTES = '<details class="note"><summary><b>How is a real karyotype made?</b></summary>' +
    '<p class="small">A real karyotype is a photograph. Cells are stopped while they divide, when the chromosomes are coiled tightest. The chromosomes are stained and photographed, and the pictures are sorted into pairs by length, by where the centromere sits and by the pattern of stained bands. By then the cell has copied every chromosome, so each one in the photograph is two joined copies. We draw one copy of each so the alleles are easy to read. A person has 23 pairs.</p>' +
    '<p class="small">The bands on this card are not stain. A banded chromosome is the copy that parent got from its own father, and a solid one is the copy from its own mother, the same as on the Salamander Families page.</p></details>' +
    '<p class="small muted">A model choice: how long each chromosome is drawn, where its centromere sits and where each gene sits. Our salamanders have 15 pairs of chromosomes. Red-backed salamanders have 14.</p>';
  function legendHtml() {
    return '<div class="legend"><span>' + swatch('mom', false) + 'from the egg (the mother)</span><span>' + swatch('dad', false) + 'from the sperm (the father)</span>' +
      '<span>' + swatch('mom', false) + swatch('dad', false) + 'solid: the copy that parent got from its own mother</span><span>' + swatch('mom', true) + swatch('dad', true) + 'banded: the copy from its own father</span>' +
      '<span class="muted">Two patterns on one chromosome: a mixed strand, from crossing over</span></div>';
  }
  function afterHtml() {
    return '<div id="pairwrap">' + pairHtml() + '</div><div id="checkwrap">' + checkHtml() + '</div>';
  }
  function paintAfter() {
    const a = $('#after'); if (!a) return;

  }
  const seen = () => PROJ || !!ST.seen[OPEN.baby.id];
  function render(scroll) {
    if (PLAYER) { PLAYER.stop(); PLAYER = null; }
    chips();
    if (!OPEN) { openScreen(); if (scroll) window.scrollTo(0, 0); return; }
    const O = OPEN, i = sibIndex(), prev = O.sibs[i - 1], next = O.sibs[i + 1], n = O.sibs[i].n;

    app.innerHTML = '<section class="block"><h2>' + (n ? 'Egg ' + n + ': the chromosomes of one hatchling' : 'The chromosomes of one hatchling') + '</h2><div id="player"></div>' + legendHtml() + '</section>' +
      '<div id="after"></div>' +
      '<div class="btnrow">' + (prev ? '<button type="button" class="ghost" data-act="sib" data-egg="' + prev.egg + '">&larr; ' + (prev.n ? 'Egg ' + prev.n : 'Back') + '</button>' : '') +
      '<a class="see3d hide-proj" href="' + esc(link3d(me)) + '">See this hatchling in 3D</a>' +
      '<a class="see3d" href="blue-ridge-salamander-families.html' + pass() + '">Back to Salamander Families</a><span class="grow"></span>' +
      (next ? '<button type="button" data-act="sib" data-egg="' + next.egg + '">' + (next.n ? 'Egg ' + next.n : 'Next') + ' &#9654;</button>' : '') + '</div>' +
      '<div class="btnrow hide-proj"><button type="button" class="ghost small" data-act="other">Open another hatchling</button></div>' + NOTES;

    def.onDone = function () { if (!ST.seen[O.baby.id]) { ST.seen[O.baby.id] = 1; save(); } if (!$('#checkwrap')) paintAfter(); };
    const pl = Player($('#player'), def); pl.start();

    if (scroll) window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  function pick(i, k) {
    if (!OPEN || !PLAYER || !PLAYER.atEnd()) return;
    SEL = { i: i, k: k }; PLAYER.repaint();
    const w = $('#pairwrap'); if (!w) { paintAfter(); } else { w.innerHTML = pairHtml(); miniDraw(); }
    const box = $('#pairbox'); if (box && box.scrollIntoView) { try { box.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); } catch (e) { /* older Safari */ } }
  }
  document.addEventListener('click', function (e) {
    const hit = e.target.closest && e.target.closest('.hit');
    if (hit) { pick(+hit.getAttribute('data-i'), +hit.getAttribute('data-k')); return; }
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.getAttribute('data-act');
    if (act === 'opencodes') { IN = { m: ($('#km') || {}).value || '', f: ($('#kf') || {}).value || '', egg: ($('#ke') || {}).value || '' }; const r = openFrom(IN.m, IN.f, IN.egg); if (r.ok) go({ m: r.M.keeper, f: r.D.keeper, egg: r.baby.egg }); else { MSG = r.why || 'Type both keeper codes and the egg code.'; openScreen(); } return; }

    if (act === 'pick' || act === 'show') {
      const id = b.getAttribute('data-id'), c = chkOf(true), st = c[id] || (c[id] = blankPart()), def = parts().find(p => p.id === id); if (!def) return;
      if (act === 'show') st.shown = true;
      else { const k = b.getAttribute('data-k'), o = def.opts.find(x => x.k === k); if (!o) return; st.last = k; if (o.ok) st.done = true; else { st.tries++; st.wrong[k] = true; } }
      save(); CS = null;
      const y = window.scrollY; $('#checkwrap').innerHTML = checkHtml(); $('#pairwrap').innerHTML = pairHtml(); miniDraw(); if (PLAYER) PLAYER.repaint(); window.scrollTo(0, y);
      return;
    }
  });
  document.addEventListener('keydown', function (e) {
    const t = e.target;
    if (t && t.classList && t.classList.contains('hit') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(+t.getAttribute('data-i'), +t.getAttribute('data-k')); return; }
    if (t && /INPUT|TEXTAREA|SELECT/.test(t.tagName)) { if (e.key === 'Enter' && !OPEN) { const b = $('[data-act="opencodes"]'); if (b) b.click(); } return; }
    if (!OPEN) return;
    const i = sibIndex();
    if (e.key === 'ArrowRight') { e.preventDefault(); if (PLAYER && PLAYER.fwd()) return; const nx = OPEN.sibs[i + 1]; if (nx) go({ m: OPEN.mk, f: OPEN.dk, egg: nx.egg }); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (PLAYER && PLAYER.back()) return; const pv = OPEN.sibs[i - 1]; if (pv) { go({ m: OPEN.mk, f: OPEN.dk, egg: pv.egg }); if (PLAYER) PLAYER.jumpEnd(); } }
    else if (e.key === ' ' && PLAYER && !(t && t.tagName === 'BUTTON')) { e.preventDefault(); PLAYER.again(); }
    else if (e.key >= '1' && e.key <= '4') { const x = OPEN.sibs.find(s => s.n === +e.key); if (x && x.egg !== OPEN.egg) go({ m: OPEN.mk, f: OPEN.dk, egg: x.egg }); }
  });
  window.addEventListener('hashchange', function () {
    const h = readHash();
    if (OPEN && h.egg && String(h.egg).toUpperCase() === OPEN.egg && h.m === OPEN.mk && h.f === OPEN.dk) return;
